services:
  db:
    image: postgres:17.6
    container_name: onboardpro_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Uncomment to run init scripts: - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: onboardpro_app
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
      # Add other env vars your app needs (SESSION_SECRET, etc.)
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Development service with hot reload (use: docker-compose --profile dev up db app-dev)
  app-dev:
    image: node:20
    container_name: onboardpro_dev
    working_dir: /app
    ports:
      - "5000:5000"
    volumes:
      - .:/app:cached
      - app_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
    entrypoint: /bin/bash
    command: -c "cp package.json package-lock.json /tmp/ && cd /tmp && npm ci && cp -r node_modules /app/ && cd /app && npm run dev"
    profiles:
      - dev

volumes:
  pgdata:
  app_node_modules: