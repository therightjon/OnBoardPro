            - conNcCardPosition:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =UAB.Line
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =UAB.White
                  FillPortions: =0
