                        Width: =44
                  - lblNavTemplates_NewCand:
                      Control: Label
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =If(App.ActiveScreen = scr_templates, UAB.White, UAB.NavInactive)
                        FillPortions: =1
                        Font: =Font.Arial
