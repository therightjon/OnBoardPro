                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =UABSize.Body
                        Text: ="Templates"
                        Visible: =scr_new_candidate.Size <> ScreenSize.Small
                        Wrap: =false
      - cntNewCandRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =UAB.OffWhite
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =24
            PaddingLeft: =If(scr_new_candidate.Size = ScreenSize.Small, 12, 24)
            PaddingRight: =If(scr_new_candidate.Size = ScreenSize.Small, 12, 24)
            PaddingTop: =24
            Width: =Parent.Width - If(scr_new_candidate.Size = ScreenSize.Small, UABLayout.NavRailWidthCollapsed, UABLayout.NavRailWidth)
            X: =If(scr_new_candidate.Size = ScreenSize.Small, UABLayout.NavRailWidthCollapsed, UABLayout.NavRailWidth)
          Children:
            - cntNcHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.OffWhite
                  FillPortions: =0
                  Height: =84
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - lblNcTitle:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =UAB.TextPrimary
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =UABSize.ScreenTitle
                        Text: ="New Candidate"
                  - lblNcSub:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =UAB.Gray500
                        Height: =22
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =UABSize.Secondary
                        Text: ="Creating a candidate also starts their checklist. You can change any of this later."
                        Wrap: =false
            - conNcCardPerson:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =UAB.Line
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =UAB.White
                  FillPortions: =0
                  Height: =If(scr_new_candidate.Size = ScreenSize.Small, 412, 222)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =If(scr_new_candidate.Size = ScreenSize.Small, 16, 24)
                  PaddingLeft: =If(scr_new_candidate.Size = ScreenSize.Small, 16, 24)
                  PaddingRight: =If(scr_new_candidate.Size = ScreenSize.Small, 16, 24)
                  PaddingTop: =If(scr_new_candidate.Size = ScreenSize.Small, 16, 24)
                Children:
                  - lblNcPersonEyebrow:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =UAB.Green
                        FontWeight: =FontWeight.Bold
                        Height: =22
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =UABSize.Eyebrow
                        Text: ="CANDIDATE"
                        Wrap: =false
                  - conNcRowName:
