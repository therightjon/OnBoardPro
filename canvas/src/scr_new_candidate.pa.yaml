                        FontWeight: =FontWeight.Bold
                        Height: =22
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =UABSize.Eyebrow
                        Text: ="PEOPLE & DATES"
                        Wrap: =false
                  - conNcRowProc:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =UAB.White
                        FillPortions: =0
                        Height: =If(scr_new_candidate.Size = ScreenSize.Small, 144, 66)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =If(scr_new_candidate.Size = ScreenSize.Small, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - conNcFManager:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =UAB.White
                              Height: =66
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - lblNcManagerCap:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =UAB.Gray700
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =UABSize.Secondary
                                    Text: ="Hiring manager"
                                    Wrap: =false
                              - cmbNcManager:
                                  Control: ModernCombobox
                                  Properties:
                                    FillPortions: =1
                                    Height: =40
                                    InputTextPlaceholder: ="Type at least 2 letters of a name"
                                    ItemDisplayText: =ThisItem.PickerLabel
                                    Items: |-
                                      =AddColumns(
                                          Filter(
                                              Office365Users.SearchUser(
                                                  {searchTerm: Trim(cmbNcManager.SearchText), top: 50}),
                                              Len(Trim(cmbNcManager.SearchText)) >= 2,
                                              !IsBlank(Surname),
                                              !StartsWith(DisplayName, "!"),
                                              !IsBlank(Coalesce(Mail, UserPrincipalName))),
                                          PickerLabel,
                                          Surname & ", " & GivenName & "  ·  " & Coalesce(Mail, UserPrincipalName))
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    SelectMultiple: =false
                        - conNcFLOI:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =UAB.White
                              Height: =66
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - lblNcLOICap:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =UAB.Gray700
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =UABSize.Secondary
                                    Text: ="Letter of Intent date"
                                    Wrap: =false
                              - dpNcLOI:
                                  Control: ModernDatePicker
                                  Properties:
                                    DefaultDate: =Blank()
                                    FillPortions: =1
                                    Height: =40
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
            - conNcActions:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.OffWhite
                  FillPortions: =0
                  Height: =If(scr_new_candidate.Size = ScreenSize.Small, 110, 40)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - conNcButtons:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =UAB.OffWhite
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - btnNcCreate:
                            Control: Button
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =UAB.Green
                              DisplayMode: |-
                                =If(And(!IsBlank(Trim(txtNcFirst.Text)),
                                    !IsBlank(Trim(txtNcLast.Text)),
                                    IsMatch(Trim(txtNcEmail.Text), Match.Email),
                                    !IsBlank(cmbNcType.Selected),
                                    !IsBlank(cmbNcTemplate.Selected)), DisplayMode.Edit, DisplayMode.Disabled)
                              FillPortions: =If(scr_new_candidate.Size = ScreenSize.Small, 1, 0)
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =IfError(
                                    With({rec: Patch(Candidates, Defaults(Candidates),
                                        {Title: Trim(txtNcLast.Text) & ", " & Trim(txtNcFirst.Text),
                                         FirstName: Trim(txtNcFirst.Text),
                                         LastName: Trim(txtNcLast.Text),
                                         Salutation: If(IsBlank(cmbNcSalutation.Selected), Blank(),
                                             {Value: cmbNcSalutation.Selected.Value}),
                                         Email: Trim(txtNcEmail.Text),
                                         CandidateType: {Value: cmbNcType.Selected.Value},
                                         Department: {Id: 1, Value: LookUp(Departments, ID = 1).Title},
                                         Division: If(IsBlank(cmbNcDivision.Selected), Blank(),
                                             {Id: cmbNcDivision.Selected.ID, Value: cmbNcDivision.Selected.Title}),
                                         FacultyRank: If(IsBlank(cmbNcRank.Selected), Blank(),
                                             {Id: cmbNcRank.Selected.ID, Value: cmbNcRank.Selected.Title}),
                                         Template: {Id: cmbNcTemplate.Selected.ID,
                                             Value: cmbNcTemplate.Selected.Title},
                                         Manager: If(IsBlank(cmbNcManager.Selected), Blank(),
                                             {Claims: "i:0#.f|membership|"
                                                   & Lower(Coalesce(cmbNcManager.Selected.Mail,
                                                       cmbNcManager.Selected.UserPrincipalName)),
                                               Department: "",
                                               DisplayName: cmbNcManager.Selected.DisplayName,
                                               Email: Coalesce(cmbNcManager.Selected.Mail,
                                                   cmbNcManager.Selected.UserPrincipalName),
                                               JobTitle: "", Picture: ""}),
                                         PrimaryOwner: {Claims: "i:0#.f|membership|" & Lower(User().Email),
                                     Department: "", DisplayName: User().FullName, Email: User().Email,
                                     JobTitle: "", Picture: ""},
                                         CStatus: {Value: "Active"},
                                         LOIDate: dpNcLOI.SelectedDate})},
                                        Set(varSelCandId, rec.ID);
                                        'OnBoard-ApplyTemplate'.Run(rec.ID, "prereq");
                                        Refresh(Tasks); Refresh(Candidates);
                                        Notify("Candidate created. Prerequisite tasks are being added.",
                                            NotificationType.Success);
                                        Navigate(scr_candidates)),
                                    Notify("Couldn't create the candidate - " & FirstError.Message
                                        & " Nothing was saved. Try again.", NotificationType.Error))
                              Text: ="Create Candidate"
                              Width: =If(scr_new_candidate.Size = ScreenSize.Small, 160, 190)
                        - btnNcCancel:
                            Control: Button
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =UAB.Green
                              FillPortions: =If(scr_new_candidate.Size = ScreenSize.Small, 1, 0)
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scr_candidates)
                              Text: ="Cancel"
                              Width: =If(scr_new_candidate.Size = ScreenSize.Small, 110, 120)
            - lblNcSpacer:
                Control: ModernText
                Properties:
                  Align: =Align.Center
                  Color: =UAB.OffWhite
                  Height: =24
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Size: =2
                  Text: =""
                  Wrap: =false
