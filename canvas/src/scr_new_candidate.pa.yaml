                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - lblNcTypeCap:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =UAB.Gray700
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =UABSize.Secondary
                                    Text: ="Candidate type"
                                    Wrap: =false
                              - cmbNcType:
                                  Control: ModernCombobox
                                  Properties:
                                    FillPortions: =1
                                    Height: =40
                                    ItemDisplayText: =ThisItem.Value
                                    Items: =Choices(Candidates.CandidateType)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnChange: =Reset(cmbNcTemplate)
                                    SelectMultiple: =false
                        - conNcFDivision:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =UAB.White
                              Height: =66
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - lblNcDivisionCap:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =UAB.Gray700
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =UABSize.Secondary
                                    Text: ="Division"
                                    Wrap: =false
                              - cmbNcDivision:
                                  Control: ModernCombobox
                                  Properties:
                                    FillPortions: =1
                                    Height: =40
                                    ItemDisplayText: =ThisItem.Title
                                    Items: =SortByColumns(Divisions, "Title", SortOrder.Ascending)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    SelectMultiple: =false
                        - conNcFRank:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =UAB.White
                              Height: =66
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - lblNcRankCap:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =UAB.Gray700
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =UABSize.Secondary
                                    Text: ="Faculty rank"
                                    Wrap: =false
                              - cmbNcRank:
                                  Control: ModernCombobox
                                  Properties:
                                    FillPortions: =1
                                    Height: =40
                                    ItemDisplayText: =ThisItem.Title
                                    Items: =FacultyRanks
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    SelectMultiple: =false
                        - conNcFTemplate:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =UAB.White
                              Height: =66
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - lblNcTemplateCap:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =UAB.Gray700
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =UABSize.Secondary
                                    Text: ="Template"
                                    Wrap: =false
                              - cmbNcTemplate:
                                  Control: ModernCombobox
                                  Properties:
                                    FillPortions: =1
                                    Height: =40
                                    ItemDisplayText: =ThisItem.Title
                                    Items: |-
                                      =SortByColumns(
                                          Filter(Templates,
                                              Coalesce(TStatus.Value, "Draft") <> "Archived",
                                              IsBlank(cmbNcType.Selected)
                                                  || CandidateType.Value = cmbNcType.Selected.Value),
                                          "Title", SortOrder.Ascending)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    SelectMultiple: =false
            - conNcCardProcess:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =UAB.Line
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =UAB.White
                  FillPortions: =0
                  Height: =If(scr_new_candidate.Size = ScreenSize.Small, 210, 148)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =If(scr_new_candidate.Size = ScreenSize.Small, 16, 24)
                  PaddingLeft: =If(scr_new_candidate.Size = ScreenSize.Small, 16, 24)
                  PaddingRight: =If(scr_new_candidate.Size = ScreenSize.Small, 16, 24)
                  PaddingTop: =If(scr_new_candidate.Size = ScreenSize.Small, 16, 24)
                Children:
