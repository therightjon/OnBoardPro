Screens:
  scr_new_candidate:
    Properties:
      Fill: =UAB.OffWhite
      OnVisible: |-
        =Reset(txtNcFirst); Reset(txtNcLast); Reset(txtNcEmail);
        Reset(cmbNcSalutation); Reset(cmbNcType); Reset(cmbNcDivision);
        Reset(cmbNcRank); Reset(cmbNcTemplate); Reset(cmbNcManager);
        Reset(dpNcLOI)
    Children:
      - NavRail_NewCand:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =UAB.Green
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =4
            PaddingBottom: =32
            PaddingTop: =32
            Width: =If(scr_new_candidate.Size = ScreenSize.Small, UABLayout.NavRailWidthCollapsed, UABLayout.NavRailWidth)
          Children:
            - lblAppName_NewCand:
                Control: Label
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =UAB.White
                  Font: =Font.Arial
                  FontWeight: =FontWeight.Bold
                  Height: =56
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =20
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =20
                  Text: ="OnBoardPro"
                  Visible: =scr_new_candidate.Size <> ScreenSize.Small
                  Wrap: =false
            - lblAppSub_NewCand:
                Control: Label
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =UAB.Gold
                  Font: =Font.Arial
                  Height: =24
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =20
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =11
                  Text: ="OBGYN Onboarding"
                  Visible: =scr_new_candidate.Size <> ScreenSize.Small
                  Wrap: =false
            - conNavNewCand_NewCand:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.Green
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =IsHR
                Children:
                  - conNavBarNewCand_NewCand:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =If(App.ActiveScreen = scr_new_candidate, UAB.Gold, RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =4
                  - icoNavNewCand_NewCand:
                      Control: Classic/Icon
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Color: =If(App.ActiveScreen = scr_new_candidate, UAB.White, UAB.NavInactive)
                        Height: =44
                        Icon: =Icon.Add
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_new_candidate)
                        PaddingLeft: =12
                        Width: =44
                  - lblNavNewCand_NewCand:
                      Control: Label
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =If(App.ActiveScreen = scr_new_candidate, UAB.White, UAB.NavInactive)
                        FillPortions: =1
                        Font: =Font.Arial
                        FontWeight: =If(App.ActiveScreen = scr_new_candidate, FontWeight.Semibold, FontWeight.Normal)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_new_candidate)
                        PaddingBottom: =0
                        PaddingLeft: =8
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =UABSize.Body
                        Text: ="New Candidate"
                        Visible: =scr_new_candidate.Size <> ScreenSize.Small
                        Wrap: =false
            - conNavCandidates_NewCand:
