                        Height: =44
                        Icon: =Icon.People
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_candidates)
                        PaddingLeft: =12
                        TabIndex: =0
                        Width: =44
                  - lblNavItemCandidates:
                      Control: Label
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =If(App.ActiveScreen = scr_candidates, UAB.White, UAB.NavInactive)
                        FillPortions: =1
                        FocusedBorderColor: =UAB.Gold
