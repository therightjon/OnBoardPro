                        PaddingBottom: =0
                        PaddingLeft: =8
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =UABSize.Body
                        TabIndex: =0
                        Text: ="Candidates"
                        Visible: =conNavRoot.Width > 100
                        Wrap: =false
