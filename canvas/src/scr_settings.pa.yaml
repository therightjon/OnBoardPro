Screens:
  scr_settings:
    Properties:
      Fill: =UAB.OffWhite
      OnVisible: =Refresh(AppPermissions)
    Children:
      - NavRail_Settings:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =UAB.Green
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =4
            PaddingBottom: =32
            PaddingTop: =32
            Width: =If(scr_settings.Size = ScreenSize.Small, UABLayout.NavRailWidthCollapsed, UABLayout.NavRailWidth)
          Children:
            - lblAppName_Settings:
                Control: Label
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =UAB.White
                  Font: =Font.Arial
                  FontWeight: =FontWeight.Bold
                  Height: =56
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =20
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =20
                  Text: ="OnBoardPro"
                  Visible: =scr_settings.Size <> ScreenSize.Small
                  Wrap: =false
            - lblAppSub_Settings:
                Control: Label
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =UAB.Gold
                  Font: =Font.Arial
                  Height: =24
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =20
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =11
                  Text: ="OBGYN Onboarding"
                  Visible: =scr_settings.Size <> ScreenSize.Small
                  Wrap: =false
            - conNavNewCand_Settings:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.Green
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =IsHR
                Children:
                  - conNavBarNewCand_Settings:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =If(App.ActiveScreen = scr_new_candidate, UAB.Gold, RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =4
                  - icoNavNewCand_Settings:
                      Control: Classic/Icon
                      Properties:
                        AccessibleLabel: ="New Candidate"
                        AlignInContainer: =AlignInContainer.Center
                        Color: =If(App.ActiveScreen = scr_new_candidate, UAB.White, UAB.NavInactive)
                        FocusedBorderColor: =UAB.Gold
                        Height: =44
                        Icon: =Icon.Add
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_new_candidate)
                        PaddingLeft: =12
                        TabIndex: =0
                        Width: =44
                  - lblNavNewCand_Settings:
                      Control: Label
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =If(App.ActiveScreen = scr_new_candidate, UAB.White, UAB.NavInactive)
                        FillPortions: =1
                        FocusedBorderColor: =UAB.Gold
                        FocusedBorderThickness: =2
                        Font: =Font.Arial
                        FontWeight: =If(App.ActiveScreen = scr_new_candidate, FontWeight.Semibold, FontWeight.Normal)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_new_candidate)
                        PaddingBottom: =0
                        PaddingLeft: =8
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =UABSize.Body
                        TabIndex: =0
                        Text: ="New Candidate"
                        Visible: =scr_settings.Size <> ScreenSize.Small
                        Wrap: =false
            - conNavCandidates_Settings:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.Green
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =IsManagerOrHR
                Children:
                  - conNavBarCandidates_Settings:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =If(App.ActiveScreen = scr_candidates, UAB.Gold, RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =4
                  - icoNavCandidates_Settings:
                      Control: Classic/Icon
                      Properties:
                        AccessibleLabel: ="Candidates"
                        AlignInContainer: =AlignInContainer.Center
                        Color: =If(App.ActiveScreen = scr_candidates, UAB.White, UAB.NavInactive)
                        FocusedBorderColor: =UAB.Gold
                        Height: =44
                        Icon: =Icon.People
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_candidates)
                        PaddingLeft: =12
                        TabIndex: =0
                        Width: =44
                  - lblNavCandidates_Settings:
                      Control: Label
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =If(App.ActiveScreen = scr_candidates, UAB.White, UAB.NavInactive)
                        FillPortions: =1
                        FocusedBorderColor: =UAB.Gold
                        FocusedBorderThickness: =2
                        Font: =Font.Arial
                        FontWeight: =If(App.ActiveScreen = scr_candidates, FontWeight.Semibold, FontWeight.Normal)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_candidates)
                        PaddingBottom: =0
                        PaddingLeft: =8
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =UABSize.Body
                        TabIndex: =0
                        Text: ="Candidates"
                        Visible: =scr_settings.Size <> ScreenSize.Small
                        Wrap: =false
            - conNavMyTasks_Settings:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.Green
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - conNavBarMyTasks_Settings:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =If(App.ActiveScreen = scr_mytasks, UAB.Gold, RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =4
                  - icoNavMyTasks_Settings:
                      Control: Classic/Icon
                      Properties:
                        AccessibleLabel: ="My Tasks"
                        AlignInContainer: =AlignInContainer.Center
                        Color: =If(App.ActiveScreen = scr_mytasks, UAB.White, UAB.NavInactive)
                        FocusedBorderColor: =UAB.Gold
                        Height: =44
                        Icon: =Icon.Check
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_mytasks)
                        PaddingLeft: =12
                        TabIndex: =0
                        Width: =44
                  - lblNavMyTasks_Settings:
                      Control: Label
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =If(App.ActiveScreen = scr_mytasks, UAB.White, UAB.NavInactive)
                        FillPortions: =1
                        FocusedBorderColor: =UAB.Gold
                        FocusedBorderThickness: =2
                        Font: =Font.Arial
                        FontWeight: =If(App.ActiveScreen = scr_mytasks, FontWeight.Semibold, FontWeight.Normal)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_mytasks)
                        PaddingBottom: =0
                        PaddingLeft: =8
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =UABSize.Body
                        TabIndex: =0
                        Text: ="My Tasks"
                        Visible: =scr_settings.Size <> ScreenSize.Small
                        Wrap: =false
            - conNavTemplates_Settings:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.Green
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =IsHR
                Children:
                  - conNavBarTemplates_Settings:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =If(App.ActiveScreen = scr_templates, UAB.Gold, RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =4
                  - icoNavTemplates_Settings:
                      Control: Classic/Icon
                      Properties:
                        AccessibleLabel: ="Templates"
                        AlignInContainer: =AlignInContainer.Center
                        Color: =If(App.ActiveScreen = scr_templates, UAB.White, UAB.NavInactive)
                        FocusedBorderColor: =UAB.Gold
                        Height: =44
                        Icon: =Icon.DocumentWithContent
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_templates)
                        PaddingLeft: =12
                        TabIndex: =0
                        Width: =44
                  - lblNavTemplates_Settings:
                      Control: Label
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =If(App.ActiveScreen = scr_templates, UAB.White, UAB.NavInactive)
                        FillPortions: =1
                        FocusedBorderColor: =UAB.Gold
                        FocusedBorderThickness: =2
                        Font: =Font.Arial
                        FontWeight: =If(App.ActiveScreen = scr_templates, FontWeight.Semibold, FontWeight.Normal)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_templates)
                        PaddingBottom: =0
                        PaddingLeft: =8
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =UABSize.Body
                        TabIndex: =0
                        Text: ="Templates"
                        Visible: =scr_settings.Size <> ScreenSize.Small
                        Wrap: =false
            - conNavTaskLib_Settings:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.Green
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =IsHR
                Children:
                  - conNavBarTaskLib_Settings:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =If(App.ActiveScreen = scr_tasklibrary, UAB.Gold, RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =4
                  - icoNavTaskLib_Settings:
                      Control: Classic/Icon
                      Properties:
                        AccessibleLabel: ="Task Library"
                        AlignInContainer: =AlignInContainer.Center
                        Color: =If(App.ActiveScreen = scr_tasklibrary, UAB.White, UAB.NavInactive)
                        FocusedBorderColor: =UAB.Gold
                        Height: =44
                        Icon: =Icon.Notebook
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_tasklibrary)
                        PaddingLeft: =12
                        TabIndex: =0
                        Width: =44
                  - lblNavTaskLib_Settings:
                      Control: Label
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =If(App.ActiveScreen = scr_tasklibrary, UAB.White, UAB.NavInactive)
                        FillPortions: =1
                        FocusedBorderColor: =UAB.Gold
                        FocusedBorderThickness: =2
                        Font: =Font.Arial
                        FontWeight: =If(App.ActiveScreen = scr_tasklibrary, FontWeight.Semibold, FontWeight.Normal)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_tasklibrary)
                        PaddingBottom: =0
                        PaddingLeft: =8
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =UABSize.Body
                        TabIndex: =0
                        Text: ="Task Library"
                        Visible: =scr_settings.Size <> ScreenSize.Small
                        Wrap: =false
            - conNavSettings_Settings:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.Green
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - conNavBarSettings_Settings:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =If(App.ActiveScreen = scr_settings || App.ActiveScreen = scr_admin_users || App.ActiveScreen = scr_admin_refdata, UAB.Gold, RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =4
                  - icoNavSettings_Settings:
                      Control: Classic/Icon
                      Properties:
                        AccessibleLabel: ="Settings"
                        AlignInContainer: =AlignInContainer.Center
                        Color: =If(App.ActiveScreen = scr_settings || App.ActiveScreen = scr_admin_users || App.ActiveScreen = scr_admin_refdata, UAB.White, UAB.NavInactive)
                        FocusedBorderColor: =UAB.Gold
                        Height: =44
                        Icon: =Icon.Settings
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_settings)
                        PaddingLeft: =12
                        TabIndex: =0
                        Width: =44
                  - lblNavSettings_Settings:
                      Control: Label
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =If(App.ActiveScreen = scr_settings || App.ActiveScreen = scr_admin_users || App.ActiveScreen = scr_admin_refdata, UAB.White, UAB.NavInactive)
                        FillPortions: =1
                        FocusedBorderColor: =UAB.Gold
                        FocusedBorderThickness: =2
                        Font: =Font.Arial
                        FontWeight: =If(App.ActiveScreen = scr_settings || App.ActiveScreen = scr_admin_users || App.ActiveScreen = scr_admin_refdata, FontWeight.Semibold, FontWeight.Normal)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_settings)
                        PaddingBottom: =0
                        PaddingLeft: =8
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =UABSize.Body
                        TabIndex: =0
                        Text: ="Settings"
                        Visible: =scr_settings.Size <> ScreenSize.Small
                        Wrap: =false
      - cntSettingsRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =UAB.OffWhite
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =24
            PaddingLeft: =If(scr_settings.Size = ScreenSize.Small, 12, 24)
            PaddingRight: =If(scr_settings.Size = ScreenSize.Small, 12, 24)
            PaddingTop: =24
            Width: =Parent.Width - If(scr_settings.Size = ScreenSize.Small, UABLayout.NavRailWidthCollapsed, UABLayout.NavRailWidth)
            X: =If(scr_settings.Size = ScreenSize.Small, UABLayout.NavRailWidthCollapsed, UABLayout.NavRailWidth)
          Children:
            - cntStHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.OffWhite
                  FillPortions: =0
                  Height: =If(scr_settings.Size = ScreenSize.Small, 88, 100)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - lblStTitle:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =UAB.TextPrimary
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =UABSize.ScreenTitle
                        Text: ="Settings"
                        Wrap: =false
                  - lblStSub:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =UAB.Gray500
                        Height: =20
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =UABSize.Body
                        Text: =If(IsHR, "Your notification preference and app administration.", "Your notification preference.")
            - conStMeCard:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Start
                  BorderColor: =UAB.Line
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =UAB.White
                  FillPortions: =0
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =20
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =20
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =Min(640, Parent.Width)
                Children:
                  - lblStEyebrow:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =UAB.Green
                        FontWeight: =FontWeight.Bold
                        Height: =18
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =UABSize.Eyebrow
                        Text: ="MY NOTIFICATIONS"
                  - lblStMeName:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =UAB.TextPrimary
                        FontWeight: =FontWeight.Semibold
                        Height: =30
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =UABSize.SectionHeading
                        Text: =FriendlyName(User().FullName)
                        Wrap: =false
                  - conStMeMeta:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =UAB.White
                        FillPortions: =0
                        Height: =24
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - conPillStRole:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              Fill: =RoleFill(MyRole)
                              FillPortions: =0
                              Height: =24
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingLeft: =10
                              PaddingRight: =10
                              RadiusBottomLeft: =999
                              RadiusBottomRight: =999
                              RadiusTopLeft: =999
                              RadiusTopRight: =999
                              Width: =90
                            Children:
                              - lblPillStRole:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    Color: =RoleColor(MyRole)
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    Height: =18
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =12
                                    Text: =MyRole
                        - lblStMeDiv:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =UAB.Gray700
                              FillPortions: =1
                              Height: =18
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =UABSize.Secondary
                              Text: =Coalesce(MyPermRow.Division.Value, "All divisions")
                              Wrap: =false
                  - conStMeRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =UAB.White
                        FillPortions: =0
                        Height: =If(scr_settings.Size = ScreenSize.Small, 132, 66)
                        LayoutAlignItems: =If(scr_settings.Size = ScreenSize.Small, LayoutAlignItems.Stretch, LayoutAlignItems.End)
                        LayoutDirection: =If(scr_settings.Size = ScreenSize.Small, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - conStMeField:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =UAB.White
                              FillPortions: =1
                              Height: =66
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - lblStChanCap:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =UAB.Gray700
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =UABSize.Secondary
                                    Text: ="Send my notifications by"
                                    Wrap: =false
                              - cmbStChannel:
                                  Control: ModernCombobox
                                  Properties:
                                    AccessibleLabel: ="Send my notifications by"
                                    DefaultSelectedItems: =[MyNotifyChannel]
                                    DisplayMode: =If(IsBlank(MyPermRow), DisplayMode.Disabled, DisplayMode.Edit)
                                    FillPortions: =1
                                    Height: =40
                                    ItemDisplayText: =ThisItem.Value
                                    Items: =["Email", "Teams", "Email + Teams"]
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    SelectMultiple: =false
                        - btnStSave:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Save notification preference"
                              Align: =Align.Center
                              BasePaletteColor: =UAB.Green
                              DisplayMode: =If(IsBlank(MyPermRow), DisplayMode.Disabled, DisplayMode.Edit)
                              FontWeight: =""
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =IfError(
                                    With({r: 'OnBoard-SetNotifyChannel'.Run(Lower(User().Email), cmbStChannel.Selected.Value)},
                                        If(r.ok,
                                           Refresh(AppPermissions); Notify(r.message, NotificationType.Success),
                                           Notify("Couldn't save: " & r.message, NotificationType.Error))),
                                    Notify("Couldn't save your preference - " & FirstError.Message, NotificationType.Error))
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: ="Save"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =120
                  - lblStMeNote:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =UAB.Gray500
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =UABSize.Secondary
                        Text: |-
                          =If(IsBlank(MyPermRow),
                              "No app profile yet - ask HR to add you.",
                              "Assignment, digest, and approval emails always go by email. This setting adds Teams for everything else.")
                        Wrap: =true
            - conStTiles:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.OffWhite
                  FillPortions: =0
                  Height: =If(scr_settings.Size = ScreenSize.Small, 368, 176)
                  LayoutDirection: =If(scr_settings.Size = ScreenSize.Small, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =16
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =IsHR
                Children:
                  - conStTileUsers:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =UAB.Line
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =UAB.White
                        FillPortions: =1
                        Height: =176
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =20
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =20
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                      Children:
                        - icoStTileUsers:
                            Control: Classic/Icon
                            Properties:
                              AccessibleLabel: ="Users and roles"
                              AlignInContainer: =AlignInContainer.Start
                              Color: =UAB.Green
                              Height: =28
                              Icon: =Icon.People
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =28
                        - lblStTileUsersT:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =UAB.TextPrimary
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =UABSize.FieldLabel
                              Text: ="Users & roles"
                              Wrap: =false
                        - lblStTileUsersS:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =UAB.Gray500
                              Height: =18
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =UABSize.Secondary
                              Text: =CountRows(AppPermissions) & " users with an app profile"
                              Wrap: =false
                        - btnStOpenUsers:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Users and roles"
                              Align: =Align.Center
                              AlignInContainer: =AlignInContainer.Start
                              Appearance: =ButtonAppearance.Secondary
                              BasePaletteColor: =UAB.Green
                              FontWeight: =""
                              Height: =32
