Screens:
  scr_templates:
    Properties:
      Fill: =UAB.OffWhite
    Children:
      - NavRail_Templates:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =UAB.Green
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =4
            PaddingBottom: =32
            PaddingTop: =32
            Width: =If(scr_templates.Size = ScreenSize.Small, UABLayout.NavRailWidthCollapsed, UABLayout.NavRailWidth)
          Children:
            - lblAppName_Templates:
                Control: Label
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =UAB.White
                  Font: =Font.Arial
                  FontWeight: =FontWeight.Bold
                  Height: =56
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =20
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =20
                  Text: ="OnBoardPro"
                  Visible: =scr_templates.Size <> ScreenSize.Small
                  Wrap: =false
            - lblAppSub_Templates:
                Control: Label
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =UAB.Gold
                  Font: =Font.Arial
                  Height: =24
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =20
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =11
                  Text: ="OBGYN Onboarding"
                  Visible: =scr_templates.Size <> ScreenSize.Small
                  Wrap: =false
            - conNavMyTasks_Templates:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.Green
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - conNavBarMyTasks_Templates:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =If(App.ActiveScreen = scr_mytasks, UAB.Gold, RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =4
                  - icoNavMyTasks_Templates:
                      Control: Classic/Icon
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Color: =If(App.ActiveScreen = scr_mytasks, UAB.White, UAB.NavInactive)
                        Height: =44
                        Icon: =Icon.Check
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_mytasks)
                        PaddingLeft: =12
                        Width: =44
                  - lblNavMyTasks_Templates:
                      Control: Label
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =If(App.ActiveScreen = scr_mytasks, UAB.White, UAB.NavInactive)
                        FillPortions: =1
                        Font: =Font.Arial
                        FontWeight: =If(App.ActiveScreen = scr_mytasks, FontWeight.Semibold, FontWeight.Normal)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_mytasks)
                        PaddingBottom: =0
                        PaddingLeft: =8
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =UABSize.Body
                        Text: ="My Tasks"
                        Visible: =scr_templates.Size <> ScreenSize.Small
                        Wrap: =false
            - conNavCandidates_Templates:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.Green
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =IsManagerOrHR
                Children:
                  - conNavBarCandidates_Templates:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =If(App.ActiveScreen = scr_candidates, UAB.Gold, RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =4
                  - icoNavCandidates_Templates:
                      Control: Classic/Icon
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Color: =If(App.ActiveScreen = scr_candidates, UAB.White, UAB.NavInactive)
                        Height: =44
                        Icon: =Icon.People
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_candidates)
                        PaddingLeft: =12
                        Width: =44
                  - lblNavCandidates_Templates:
                      Control: Label
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =If(App.ActiveScreen = scr_candidates, UAB.White, UAB.NavInactive)
                        FillPortions: =1
                        Font: =Font.Arial
                        FontWeight: =If(App.ActiveScreen = scr_candidates, FontWeight.Semibold, FontWeight.Normal)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_candidates)
                        PaddingBottom: =0
                        PaddingLeft: =8
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =UABSize.Body
                        Text: ="Candidates"
                        Visible: =scr_templates.Size <> ScreenSize.Small
                        Wrap: =false
            - conNavNewCand_Templates:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.Green
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =IsHR
                Children:
                  - conNavBarNewCand_Templates:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =If(App.ActiveScreen = scr_new_candidate, UAB.Gold, RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =4
                  - icoNavNewCand_Templates:
                      Control: Classic/Icon
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Color: =If(App.ActiveScreen = scr_new_candidate, UAB.White, UAB.NavInactive)
                        Height: =44
                        Icon: =Icon.Add
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_new_candidate)
                        PaddingLeft: =12
                        Width: =44
                  - lblNavNewCand_Templates:
                      Control: Label
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =If(App.ActiveScreen = scr_new_candidate, UAB.White, UAB.NavInactive)
                        FillPortions: =1
                        Font: =Font.Arial
                        FontWeight: =If(App.ActiveScreen = scr_new_candidate, FontWeight.Semibold, FontWeight.Normal)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_new_candidate)
                        PaddingBottom: =0
                        PaddingLeft: =8
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =UABSize.Body
                        Text: ="New Candidate"
                        Visible: =scr_templates.Size <> ScreenSize.Small
                        Wrap: =false
            - conNavTemplates_Templates:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.Green
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =IsHR
                Children:
                  - conNavBarTemplates_Templates:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =If(App.ActiveScreen = scr_templates, UAB.Gold, RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =4
                  - icoNavTemplates_Templates:
                      Control: Classic/Icon
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Color: =If(App.ActiveScreen = scr_templates, UAB.White, UAB.NavInactive)
                        Height: =44
                        Icon: =Icon.DocumentWithContent
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_templates)
                        PaddingLeft: =12
                        Width: =44
                  - lblNavTemplates_Templates:
                      Control: Label
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =If(App.ActiveScreen = scr_templates, UAB.White, UAB.NavInactive)
                        FillPortions: =1
                        Font: =Font.Arial
                        FontWeight: =If(App.ActiveScreen = scr_templates, FontWeight.Semibold, FontWeight.Normal)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_templates)
                        PaddingBottom: =0
                        PaddingLeft: =8
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =UABSize.Body
                        Text: ="Templates"
                        Visible: =scr_templates.Size <> ScreenSize.Small
                        Wrap: =false
      - cntTemplatesRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =UAB.OffWhite
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =24
            PaddingLeft: =If(scr_templates.Size = ScreenSize.Small, 12, 24)
            PaddingRight: =If(scr_templates.Size = ScreenSize.Small, 12, 24)
            PaddingTop: =24
            Width: =Parent.Width - If(scr_templates.Size = ScreenSize.Small, UABLayout.NavRailWidthCollapsed, UABLayout.NavRailWidth)
            X: =If(scr_templates.Size = ScreenSize.Small, UABLayout.NavRailWidthCollapsed, UABLayout.NavRailWidth)
          Children:
            - cntTpHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.OffWhite
                  FillPortions: =0
                  Height: =92
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - conTpTitleRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =UAB.OffWhite
                        FillPortions: =0
                        Height: =54
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - lblTpTitle_1:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =UAB.TextPrimary
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =UABSize.ScreenTitle
                              Text: ="Templates"
                        - btnTpNewTemplate:
                            Control: Button
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =UAB.Green
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varTmTemplate, Blank());
                                Set(varTmShow, true);
                                Reset(txtTmName); Reset(cmbTmType); Reset(txtTmDesc)
                              Text: ="New Template"
                              Width: =160
                  - lblTpSub:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =UAB.Gray500
                        Height: =23
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =UABSize.Secondary
                        Text: ="A template is the checklist a new candidate starts with. Only active templates can be used."
                        Wrap: =false
            - conTpSplit:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.OffWhite
                  FillPortions: =0
                  Height: =If(scr_templates.Size = ScreenSize.Small, 1400, Max(620, scr_templates.Height - 140))
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(scr_templates.Size = ScreenSize.Small, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =16
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - conTpPicker:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =UAB.Line
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =UAB.White
                        FillPortions: =0
                        Height: =If(scr_templates.Size = ScreenSize.Small, 300, Parent.Height)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =If(scr_templates.Size = ScreenSize.Small, Parent.Width, 300)
                      Children:
                        - conTpPickHead:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =UAB.White
                              FillPortions: =0
                              Height: =48
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingLeft: =12
                              PaddingRight: =12
                            Children:
                              - tglTpShowArchived:
                                  Control: Toggle
                                  Properties:
                                    BasePaletteColor: =UAB.Green
                                    FillPortions: =1
                                    Height: =36
                                    Label: ="Show deleted"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                        - galTpTemplates:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              Fill: =UAB.White
                              Items: |-
                                =SortByColumns(
                                    Filter(Templates,
                                        tglTpShowArchived.Checked || Coalesce(TStatus.Value, "Draft") <> "Archived"),
                                    "Title", SortOrder.Ascending)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varSelTemplateId, ThisItem.ID);
                                Set(varTpStats,
                                    With({t: Filter(TemplateTasks, Template.Id = ThisItem.ID)},
                                        {stages: CountRows(Filter(TemplateStages, Template.Id = ThisItem.ID)),
                                         tasks: CountRows(t),
                                         unnamed: CountRows(Filter(t, IsBlank(Trim(Title)))),
                                         stageless: CountRows(Filter(t, IsBlank(TemplateStage.Id))),
                                         fixedNoDate: CountRows(Filter(t, Anchor.Value = "Fixed", IsBlank(FixedDate))),
                                         prereqs: CountRows(Filter(t, IsPrereq)),
                                         approvals: CountRows(Filter(t, NeedsApproval))}))
                              TemplatePadding: =0
                              TemplateSize: =64
                            Children:
                              - conTpPickRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =If(ThisItem.ID = Coalesce(varSelTemplateId, 0), UAB.GoldTint, UAB.White)
                                    Height: =Parent.TemplateHeight
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    Width: =Parent.TemplateWidth
                                  Children:
                                    - conTpPickRowContent:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =If(ThisItem.ID = Coalesce(varSelTemplateId, 0), UAB.GoldTint, UAB.White)
                                          FillPortions: =0
                                          Height: =63
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingLeft: =12
                                          PaddingRight: =12
                                        Children:
                                          - conTpPickRowMain:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =If(ThisItem.ID = Coalesce(varSelTemplateId, 0), UAB.GoldTint, UAB.White)
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =2
                                                LayoutJustifyContent: =LayoutJustifyContent.Center
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                              Children:
                                                - lblTpPickName:
                                                    Control: Label
                                                    Properties:
                                                      Color: =UAB.TextPrimary
                                                      Font: =Font.Arial
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =25
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      OnSelect: |-
                                                        =Set(varSelTemplateId, ThisItem.ID);
                                                        Set(varTpStats,
                                                            With({t: Filter(TemplateTasks, Template.Id = ThisItem.ID)},
                                                                {stages: CountRows(Filter(TemplateStages, Template.Id = ThisItem.ID)),
                                                                 tasks: CountRows(t),
                                                                 unnamed: CountRows(Filter(t, IsBlank(Trim(Title)))),
                                                                 stageless: CountRows(Filter(t, IsBlank(TemplateStage.Id))),
                                                                 fixedNoDate: CountRows(Filter(t, Anchor.Value = "Fixed", IsBlank(FixedDate))),
                                                                 prereqs: CountRows(Filter(t, IsPrereq)),
                                                                 approvals: CountRows(Filter(t, NeedsApproval))}))
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =UABSize.Body
                                                      Text: =Coalesce(ThisItem.Title, "(untitled)")
                                                      Wrap: =false
                                                - lblTpPickSub:
                                                    Control: Label
                                                    Properties:
                                                      Color: =UAB.Gray500
                                                      Font: =Font.Arial
                                                      Height: =22
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      OnSelect: |-
                                                        =Set(varSelTemplateId, ThisItem.ID);
                                                        Set(varTpStats,
                                                            With({t: Filter(TemplateTasks, Template.Id = ThisItem.ID)},
                                                                {stages: CountRows(Filter(TemplateStages, Template.Id = ThisItem.ID)),
                                                                 tasks: CountRows(t),
                                                                 unnamed: CountRows(Filter(t, IsBlank(Trim(Title)))),
                                                                 stageless: CountRows(Filter(t, IsBlank(TemplateStage.Id))),
                                                                 fixedNoDate: CountRows(Filter(t, Anchor.Value = "Fixed", IsBlank(FixedDate))),
                                                                 prereqs: CountRows(Filter(t, IsPrereq)),
                                                                 approvals: CountRows(Filter(t, NeedsApproval))}))
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =UABSize.Secondary
                                                      Text: |-
                                                        =Coalesce(ThisItem.CandidateType.Value, "Any type")
                                                            & "  ·  " & Coalesce(ThisItem.TStatus.Value, "Draft")
                                                      Wrap: =false
                                          - icoTpPickGo:
                                              Control: Classic/Icon
                                              Properties:
                                                Color: =UAB.Gray300
                                                Height: =20
                                                Icon: =Icon.ChevronRight
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnSelect: |-
                                                  =Set(varSelTemplateId, ThisItem.ID);
                                                  Set(varTpStats,
                                                      With({t: Filter(TemplateTasks, Template.Id = ThisItem.ID)},
                                                          {stages: CountRows(Filter(TemplateStages, Template.Id = ThisItem.ID)),
                                                           tasks: CountRows(t),
                                                           unnamed: CountRows(Filter(t, IsBlank(Trim(Title)))),
                                                           stageless: CountRows(Filter(t, IsBlank(TemplateStage.Id))),
                                                           fixedNoDate: CountRows(Filter(t, Anchor.Value = "Fixed", IsBlank(FixedDate))),
                                                           prereqs: CountRows(Filter(t, IsPrereq)),
                                                           approvals: CountRows(Filter(t, NeedsApproval))}))
                                                Width: =20
                                    - conTpPickRowDivider:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =UAB.Line
                                          FillPortions: =0
                                          Height: =1
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                  - conTpDetail:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =UAB.OffWhite
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                      Children:
                        - conTpNoSelection:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =UAB.Line
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =UAB.White
                              FillPortions: =0
                              Height: =If(Coalesce(varSelTemplateId, 0) = 0, 120, 0)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Visible: =Coalesce(varSelTemplateId, 0) = 0
                            Children:
                              - lblTpNoSelection:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    Color: =UAB.Gray500
                                    Height: =25
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =UABSize.Body
                                    Text: ="Select a template to see what it contains."
                        - conTpHead:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =UAB.Line
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =UAB.White
                              FillPortions: =0
                              Height: =If(scr_templates.Size = ScreenSize.Small, 258, 218)
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =If(scr_templates.Size = ScreenSize.Small, 16, 24)
                              PaddingLeft: =If(scr_templates.Size = ScreenSize.Small, 16, 24)
                              PaddingRight: =If(scr_templates.Size = ScreenSize.Small, 16, 24)
                              PaddingTop: =If(scr_templates.Size = ScreenSize.Small, 16, 24)
                              Visible: =Coalesce(varSelTemplateId, 0) > 0
                            Children:
                              - conTpHeadRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =UAB.White
                                    FillPortions: =0
                                    Height: =40
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - lblTpEyebrow2:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =UAB.Green
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Bold
                                          Height: =22
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =UABSize.Eyebrow
                                          Text: ="TEMPLATE"
                                          Wrap: =false
                                    - btnTpEditDetails:
                                        Control: Button
                                        Properties:
                                          Appearance: ='ButtonCanvas.Appearance'.Secondary
                                          BasePaletteColor: =UAB.Green
                                          DisplayMode: =If(Coalesce(varSelTemplateId, 0) > 0, DisplayMode.Edit, DisplayMode.Disabled)
                                          Height: =36
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =Set(varTmTemplate, LookUp(Templates, ID = Coalesce(varSelTemplateId, 0)));
                                            Set(varTmShow, true);
                                            Reset(txtTmName); Reset(cmbTmType); Reset(txtTmDesc)
                                          Text: ="Edit Details"
                                          Width: =140
                                    - btnTpNew:
                                        Control: Button
                                        Properties:
                                          Appearance: ='ButtonCanvas.Appearance'.Secondary
                                          BasePaletteColor: =UAB.Green
                                          DisplayMode: =If(Coalesce(varSelTemplateId, 0) > 0, DisplayMode.Edit, DisplayMode.Disabled)
                                          Height: =36
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =IfError(
                                                With({src: LookUp(Templates, ID = Coalesce(varSelTemplateId, 0))},
                                                    With({newT: Patch(Templates, Defaults(Templates),
                                                            {Title: src.Title & " (Copy)",
                                                             CandidateType: If(IsBlank(src.CandidateType), Blank(),
                                                                 {Value: src.CandidateType.Value}),
                                                             Description: src.Description,
                                                             TStatus: {Value: "Draft"},
                                                             Version: 1})},
                                                        Set(varTpStageMap,
                                                            ForAll(Filter(TemplateStages, Template.Id = src.ID) As s,
                                                                {old: s.ID,
                                                                 new: Patch(TemplateStages, Defaults(TemplateStages),
                                                                     {Template: {Id: newT.ID, Value: newT.Title},
                                                                      Title: s.Title,
                                                                      Stage: If(IsBlank(s.Stage), Blank(),
                                                                          {Id: s.Stage.Id, Value: s.Stage.Value}),
                                                                      Phase: If(IsBlank(s.Phase), Blank(),
                                                                          {Value: s.Phase.Value}),
                                                                      OrderIndex: s.OrderIndex,
