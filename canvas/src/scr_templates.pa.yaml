                            Properties:
                              AutoHeight: =true
                              Color: =UAB.Gray700
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =UABSize.Secondary
                              Text: ="Template name"
                              Wrap: =false
                        - txtTmName:
                            Control: ModernTextInput
                            Properties:
                              Default: =Coalesce(varTmTemplate.Title, "")
                              FillPortions: =1
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Placeholder: ="e.g. Faculty Hire - Clinical"
                  - conTmFType:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =UAB.White
                        Height: =66
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - lblTmTypeCap:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =UAB.Gray700
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =UABSize.Secondary
                              Text: ="Applies to candidate type"
                              Wrap: =false
                        - cmbTmType:
                            Control: ModernCombobox
                            Properties:
                              DefaultSelectedItems: |-
                                =Filter(Choices(Templates.CandidateType),
                                    Value = Coalesce(varTmTemplate.CandidateType.Value, ""))
                              FillPortions: =1
                              Height: =40
                              ItemDisplayText: =ThisItem.Value
                              Items: =Choices(Templates.CandidateType)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              SelectMultiple: =false
                  - conTmFDesc:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =UAB.White
                        Height: =102
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - lblTmDescCap:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =UAB.Gray700
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =UABSize.Secondary
                              Text: ="When to use this template"
                              Wrap: =false
                        - txtTmDesc:
                            Control: ModernTextInput
                            Properties:
                              Default: =Coalesce(varTmTemplate.Description, "")
                              FillPortions: =1
                              Height: =76
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Placeholder: ="Optional"
                              Type: =TextInputType.Multiline
                  - conTmActions:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =UAB.White
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - btnTmSave:
                            Control: Button
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =UAB.Green
                              DisplayMode: |-
                                =If(And(!IsBlank(Trim(txtTmName.Text)),
                                        !IsBlank(cmbTmType.Selected)),
                                    DisplayMode.Edit, DisplayMode.Disabled)
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =IfError(
                                    With({rec: If(IsBlank(varTmTemplate),
                                            Patch(Templates, Defaults(Templates),
                                                {Title: Trim(txtTmName.Text),
                                                 CandidateType: If(IsBlank(cmbTmType.Selected), Blank(),
                                                     {Value: cmbTmType.Selected.Value}),
                                                 Description: txtTmDesc.Text,
                                                 TStatus: {Value: "Draft"},
                                                 Version: 1}),
                                            Patch(Templates, varTmTemplate,
                                                {Title: Trim(txtTmName.Text),
                                                 CandidateType: If(IsBlank(cmbTmType.Selected), Blank(),
                                                     {Value: cmbTmType.Selected.Value}),
                                                 Description: txtTmDesc.Text}))},
                                        Set(varSelTemplateId, rec.ID)),
                                    Notify("Couldn't save the template - " & FirstError.Message
                                        & " Nothing was changed. Try again.", NotificationType.Error),
                                    Set(varTmShow, false);
                                    Set(varTpStats,
                                    With({t: Filter(TemplateTasks, Template.Id = Coalesce(varSelTemplateId, 0))},
                                        {stages: CountRows(Filter(TemplateStages, Template.Id = Coalesce(varSelTemplateId, 0))),
                                         tasks: CountRows(t),
                                         unnamed: CountRows(Filter(t, IsBlank(Trim(Title)))),
                                         stageless: CountRows(Filter(t, IsBlank(TemplateStage.Id))),
                                         fixedNoDate: CountRows(Filter(t, Anchor.Value = "Fixed", IsBlank(FixedDate))),
                                         prereqs: CountRows(Filter(t, IsPrereq)),
                                         approvals: CountRows(Filter(t, NeedsApproval))}));
                                    Notify("Template saved.", NotificationType.Success))
                              Text: ="Save Template"
                              Width: =170
                        - btnTmCancel:
                            Control: Button
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =UAB.Green
                              FillPortions: =1
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(varTmShow, false)
                              Text: ="Cancel"
                              Width: =120
                  - lblTmHint:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =UAB.Gray500
                        Height: =22
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =UABSize.Secondary
                        Text: ="New templates start as a draft. Add stages and tasks, then activate."
                        Wrap: =false
      - conSgModal:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(32, 38, 45, 0.4)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Center
            Visible: =Coalesce(varSgShow, false)
            Width: =Parent.Width
          Children:
            - conSgPanel:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  DropShadow: =DropShadow.Regular
                  Fill: =UAB.White
                  FillPortions: =0
                  Height: =436
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =24
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =24
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =Min(480, Parent.Width - 32)
                Children:
                  - lblSgTitle:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =UAB.TextPrimary
                        FontWeight: =FontWeight.Semibold
                        Height: =30
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =20
                        Text: =If(IsBlank(varSgStage), "Add Stage", "Edit Stage")
                        Wrap: =false
                  - conSgFStage:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =UAB.White
                        Height: =66
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - lblSgStageCap:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =UAB.Gray700
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =UABSize.Secondary
                              Text: ="Hiring stage"
                              Wrap: =false
                        - cmbSgStage:
                            Control: ModernCombobox
                            Properties:
                              DefaultSelectedItems: =Filter(Stages, ID = Coalesce(varSgStage.Stage.Id, 0))
                              FillPortions: =1
                              Height: =40
                              ItemDisplayText: =ThisItem.Title
                              Items: =SortByColumns(Stages, "OrderIndex", SortOrder.Ascending)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              SelectMultiple: =false
                  - conSgFPhase:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =UAB.White
                        Height: =66
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - lblSgPhaseCap:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =UAB.Gray700
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =UABSize.Secondary
                              Text: ="Phase"
                              Wrap: =false
                        - cmbSgPhase:
                            Control: ModernCombobox
                            Properties:
                              DefaultSelectedItems: |-
                                =Filter(Choices(TemplateStages.Phase),
                                    Value = Coalesce(varSgStage.Phase.Value, "Pre-Hire"))
                              FillPortions: =1
                              Height: =40
                              ItemDisplayText: =ThisItem.Value
                              Items: =Choices(TemplateStages.Phase)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              SelectMultiple: =false
                  - conSgFOrder:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =UAB.White
                        Height: =66
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - lblSgOrderCap:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =UAB.Gray700
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =UABSize.Secondary
                              Text: ="Order"
                              Wrap: =false
                        - numSgOrder:
                            Control: ModernNumberInput
                            Properties:
                              Default: |-
                                =Coalesce(varSgStage.OrderIndex,
                                    CountRows(Filter(TemplateStages, Template.Id = Coalesce(varSelTemplateId, 0))) + 1)
                              FillPortions: =1
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                  - lblSgHint:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =If(CountRows(Filter(TemplateTasks, TemplateStage.Id = Coalesce(varSgStage.ID, 0))) > 0, UAB.Danger, UAB.Gray500)
                        Height: =44
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =UABSize.Secondary
                        Text: |-
                          =If(IsBlank(varSgStage),
                                  "Pre-hire stages run before the start date; onboarding after.",
                              CountRows(Filter(TemplateTasks, TemplateStage.Id = Coalesce(varSgStage.ID, 0))) > 0,
                                  "This stage holds " & CountRows(Filter(TemplateTasks, TemplateStage.Id = Coalesce(varSgStage.ID, 0))) & " tasks. Move them to another stage before removing it.",
                              "This stage has no tasks, so it can be removed safely.")
                  - conSgActions:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =UAB.White
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - btnSgSave:
                            Control: Button
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =UAB.Green
                              DisplayMode: |-
                                =If(!IsBlank(cmbSgStage.Selected),
                                    DisplayMode.Edit, DisplayMode.Disabled)
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =IfError(
                                    If(IsBlank(varSgStage),
                                        Patch(TemplateStages, Defaults(TemplateStages),
                                            {Template: {Id: Coalesce(varSelTemplateId, 0), Value: LookUp(Templates, ID = Coalesce(varSelTemplateId, 0)).Title},
                                             Title: cmbSgStage.Selected.Title,
                                             Stage: {Id: cmbSgStage.Selected.ID, Value: cmbSgStage.Selected.Title},
                                             Phase: {Value: cmbSgPhase.Selected.Value},
                                             OrderIndex: numSgOrder.Value,
                                             IsActive: true}),
                                        Patch(TemplateStages, varSgStage,
                                            {Title: cmbSgStage.Selected.Title,
                                             Stage: {Id: cmbSgStage.Selected.ID, Value: cmbSgStage.Selected.Title},
                                             Phase: {Value: cmbSgPhase.Selected.Value},
                                             OrderIndex: numSgOrder.Value})),
                                    Notify("Couldn't save the stage - " & FirstError.Message
                                        & " Nothing was changed. Try again.", NotificationType.Error),
                                    Set(varSgShow, false);
                                    Set(varTpStats,
                                    With({t: Filter(TemplateTasks, Template.Id = Coalesce(varSelTemplateId, 0))},
                                        {stages: CountRows(Filter(TemplateStages, Template.Id = Coalesce(varSelTemplateId, 0))),
                                         tasks: CountRows(t),
                                         unnamed: CountRows(Filter(t, IsBlank(Trim(Title)))),
                                         stageless: CountRows(Filter(t, IsBlank(TemplateStage.Id))),
                                         fixedNoDate: CountRows(Filter(t, Anchor.Value = "Fixed", IsBlank(FixedDate))),
                                         prereqs: CountRows(Filter(t, IsPrereq)),
                                         approvals: CountRows(Filter(t, NeedsApproval))}));
                                    Notify("Stage saved.", NotificationType.Success))
                              Text: ="Save Stage"
                              Width: =140
                        - btnSgCancel:
                            Control: Button
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =UAB.Green
                              FillPortions: =1
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(varSgShow, false)
                              Text: ="Cancel"
                              Width: =110
                        - btnSgDelete:
                            Control: Button
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =UAB.Danger
                              DisplayMode: =If(CountRows(Filter(TemplateTasks, TemplateStage.Id = Coalesce(varSgStage.ID, 0))) = 0, DisplayMode.Edit, DisplayMode.Disabled)
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =IfError(
                                    RemoveIf(TemplateStages, ID = varSgStage.ID),
                                    Notify("Couldn't remove the stage - " & FirstError.Message
                                        & " Nothing was removed. Try again.", NotificationType.Error),
                                    Set(varSgShow, false);
                                    Set(varTpStats,
                                    With({t: Filter(TemplateTasks, Template.Id = Coalesce(varSelTemplateId, 0))},
                                        {stages: CountRows(Filter(TemplateStages, Template.Id = Coalesce(varSelTemplateId, 0))),
                                         tasks: CountRows(t),
                                         unnamed: CountRows(Filter(t, IsBlank(Trim(Title)))),
                                         stageless: CountRows(Filter(t, IsBlank(TemplateStage.Id))),
                                         fixedNoDate: CountRows(Filter(t, Anchor.Value = "Fixed", IsBlank(FixedDate))),
                                         prereqs: CountRows(Filter(t, IsPrereq)),
                                         approvals: CountRows(Filter(t, NeedsApproval))}));
                                    Notify("Stage removed.", NotificationType.Success))
                              Text: ="Remove"
                              Visible: =!IsBlank(varSgStage)
                              Width: =110
      - conTdConfirm:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(32, 38, 45, 0.4)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Center
            Visible: =Coalesce(varTdConfirm, false)
            Width: =Parent.Width
          Children:
            - conTdPanel:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  DropShadow: =DropShadow.Regular
                  Fill: =UAB.White
                  FillPortions: =0
                  Height: =280
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =24
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =24
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =Min(480, Parent.Width - 32)
                Children:
                  - lblTdTitle:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =UAB.TextPrimary
                        FontWeight: =FontWeight.Semibold
                        Height: =31
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =20
                        Text: ="Delete This Template?"
                        Wrap: =false
                  - lblTdBody:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =UAB.Gray700
                        Height: =72
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =UABSize.Body
                        Text: |-
                          ="Deleting hides " & Coalesce(LookUp(Templates, ID = Coalesce(varSelTemplateId, 0)).Title, "this template")
                              & " from the lists. Nothing is erased — it stays on record and you can restore it later."
                  - lblTdImpact:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =UAB.Gray500
                        Height: =44
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =UABSize.Secondary
                        Text: |-
                          =If(CountRows(Filter(Candidates, Template.Id = Coalesce(varSelTemplateId, 0))) = 0,
                                  "No candidates are using it.",
                              CountRows(Filter(Candidates, Template.Id = Coalesce(varSelTemplateId, 0))) & " candidate(s) already use it. Their checklists are their own copies and are not affected.")
                  - conTdActions:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =UAB.White
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - btnTdConfirm:
                            Control: Button
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =UAB.Danger
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =IfError(
                                    Patch(Templates, LookUp(Templates, ID = Coalesce(varSelTemplateId, 0)), {TStatus: {Value: "Archived"}}),
                                    Notify("Couldn't delete the template - " & FirstError.Message
                                        & " Nothing was changed. Try again.", NotificationType.Error),
                                    Set(varTdConfirm, false);
                                    Set(varSelTemplateId, 0);
                                    Notify("Template deleted. It is kept for the record and can be restored.",
                                        NotificationType.Success))
                              Text: ="Delete Template"
                              Width: =170
                        - btnTdCancel:
                            Control: Button
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =UAB.Green
                              FillPortions: =1
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(varTdConfirm, false)
                              Text: ="Keep It"
                              Width: =120
