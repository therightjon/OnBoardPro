                                =If(And(!IsBlank(Trim(txtTeTitle.Text)),
                                        !IsBlank(cmbTeStage.Selected)),
                                    DisplayMode.Edit, DisplayMode.Disabled)
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =IfError(
                                    If(IsBlank(varTeTask),
                                        Patch(TemplateTasks, Defaults(TemplateTasks),
                                            {Template: {Id: Coalesce(varSelTemplateId, 0), Value: LookUp(Templates, ID = Coalesce(varSelTemplateId, 0)).Title}},
                                            {Title: Trim(txtTeTitle.Text),
                                         TemplateStage: If(IsBlank(cmbTeStage.Selected), Blank(),
                                             {Id: cmbTeStage.Selected.ID,
                                              Value: Coalesce(cmbTeStage.Selected.Title, cmbTeStage.Selected.Stage.Value)}),
                                         AssigneeRole: If(IsBlank(cmbTeRole.Selected), Blank(),
                                             {Value: cmbTeRole.Selected.Value}),
                                         Anchor: If(IsBlank(cmbTeAnchor.Selected), Blank(),
                                             {Value: cmbTeAnchor.Selected.Value}),
                                         OffsetDays: If(Coalesce(cmbTeWhen.Selected.Value, "On") = "On", 0,
                                             Coalesce(cmbTeWhen.Selected.Value, "") = "Before", -Abs(numTeOffset.Value),
                                             Abs(numTeOffset.Value)),
                                         FixedDate: If(Coalesce(cmbTeAnchor.Selected.Value, "") = "Fixed",
                                             dpTeFixed.SelectedDate, Blank()),
                                         OrderIndex: numTeOrder.Value,
                                         Priority: If(IsBlank(cmbTePriority.Selected), Blank(),
                                             {Value: cmbTePriority.Selected.Value}),
                                         Category: If(IsBlank(cmbTeCategory.Selected), Blank(),
                                             {Value: cmbTeCategory.Selected.Value}),
                                         IsRequired: tglTeRequired.Checked,
                                         IsPrereq: tglTePrereq.Checked,
                                         NeedsApproval: tglTeApproval.Checked,
                                             PrereqCondition: If(!tglTePrereq.Checked, Blank(),
                                                 If(IsBlank(cmbTePrereqCond.Selected), Blank(),
                                                     {Value: cmbTePrereqCond.Selected.Value}))
                                                 }),
                                        Patch(TemplateTasks, varTeTask,
                                            {Title: Trim(txtTeTitle.Text),
                                         TemplateStage: If(IsBlank(cmbTeStage.Selected), Blank(),
                                             {Id: cmbTeStage.Selected.ID,
                                              Value: Coalesce(cmbTeStage.Selected.Title, cmbTeStage.Selected.Stage.Value)}),
                                         AssigneeRole: If(IsBlank(cmbTeRole.Selected), Blank(),
                                             {Value: cmbTeRole.Selected.Value}),
                                         Anchor: If(IsBlank(cmbTeAnchor.Selected), Blank(),
                                             {Value: cmbTeAnchor.Selected.Value}),
                                         OffsetDays: If(Coalesce(cmbTeWhen.Selected.Value, "On") = "On", 0,
                                             Coalesce(cmbTeWhen.Selected.Value, "") = "Before", -Abs(numTeOffset.Value),
                                             Abs(numTeOffset.Value)),
                                         FixedDate: If(Coalesce(cmbTeAnchor.Selected.Value, "") = "Fixed",
                                             dpTeFixed.SelectedDate, Blank()),
                                         OrderIndex: numTeOrder.Value,
                                         Priority: If(IsBlank(cmbTePriority.Selected), Blank(),
                                             {Value: cmbTePriority.Selected.Value}),
                                         Category: If(IsBlank(cmbTeCategory.Selected), Blank(),
                                             {Value: cmbTeCategory.Selected.Value}),
                                         IsRequired: tglTeRequired.Checked,
                                         IsPrereq: tglTePrereq.Checked,
                                         NeedsApproval: tglTeApproval.Checked,
                                             PrereqCondition: If(!tglTePrereq.Checked, Blank(),
                                                 If(IsBlank(cmbTePrereqCond.Selected), Blank(),
                                                     {Value: cmbTePrereqCond.Selected.Value}))
                                                 })),
                                    Notify("Couldn't save the task - " & FirstError.Message
                                        & " Nothing was changed. Try again.", NotificationType.Error),
                                    Set(varTeShow, false);
                                    Set(varTpStats,
                                    With({t: Filter(TemplateTasks, Template.Id = Coalesce(varSelTemplateId, 0))},
