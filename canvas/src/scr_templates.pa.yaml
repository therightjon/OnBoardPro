                              IsBlank(cmbTeStage.Selected),
                                  "Choose which stage this task belongs to.",
                              Coalesce(cmbTeAnchor.Selected.Value, "None") = "None",
                                  "No anchor — this task will have no due date.",
                              Coalesce(cmbTeAnchor.Selected.Value, "") = "Fixed",
                                  "Due on the fixed date above.",
                              Coalesce(cmbTeWhen.Selected.Value, "On") = "On",
                                  "Due on the " & cmbTeAnchor.Selected.Value & " date.",
                              "Due " & Abs(numTeOffset.Value) & " days "
                                  & Lower(cmbTeWhen.Selected.Value) & " the "
                                  & cmbTeAnchor.Selected.Value & " date.")
