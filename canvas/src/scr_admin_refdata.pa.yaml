                  FontWeight: =FontWeight.Bold
                  Height: =56
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =20
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =20
                  Text: ="OnBoardPro"
                  Visible: =scr_admin_refdata.Size <> ScreenSize.Small
                  Wrap: =false
            - lblAppSub_AdmRef:
