                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - conNavBarSettings_AdmRef:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =If(App.ActiveScreen = scr_settings || App.ActiveScreen = scr_admin_users || App.ActiveScreen = scr_admin_refdata, UAB.Gold, RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =4
                  - icoNavSettings_AdmRef:
                      Control: Classic/Icon
                      Properties:
                        AccessibleLabel: ="Settings"
                        AlignInContainer: =AlignInContainer.Center
                        Color: =If(App.ActiveScreen = scr_settings || App.ActiveScreen = scr_admin_users || App.ActiveScreen = scr_admin_refdata, UAB.White, UAB.NavInactive)
                        FocusedBorderColor: =UAB.Gold
                        Height: =44
                        Icon: =Icon.Settings
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_settings)
                        PaddingLeft: =12
                        TabIndex: =0
                        Width: =44
                  - lblNavSettings_AdmRef:
                      Control: Label
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =If(App.ActiveScreen = scr_settings || App.ActiveScreen = scr_admin_users || App.ActiveScreen = scr_admin_refdata, UAB.White, UAB.NavInactive)
