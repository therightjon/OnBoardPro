Screens:
  scr_admin_refdata:
    Properties:
      Fill: =UAB.OffWhite
      OnVisible: |-
        =Select(btnArGuard);
        Set(varArEntity, Coalesce(varArEntity, "Divisions"));
        Select(btnArReload)
