      - cntAdmRefRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =UAB.OffWhite
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =24
            PaddingLeft: =If(scr_admin_refdata.Size = ScreenSize.Small, 12, 24)
            PaddingRight: =If(scr_admin_refdata.Size = ScreenSize.Small, 12, 24)
            PaddingTop: =24
            Width: =Parent.Width - If(scr_admin_refdata.Size = ScreenSize.Small, UABLayout.NavRailWidthCollapsed, UABLayout.NavRailWidth)
            X: =If(scr_admin_refdata.Size = ScreenSize.Small, UABLayout.NavRailWidthCollapsed, UABLayout.NavRailWidth)
          Children:
            - cntArHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.OffWhite
                  FillPortions: =0
                  Height: =If(scr_admin_refdata.Size = ScreenSize.Small, 129, 92)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - conArTitleRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =UAB.OffWhite
                        FillPortions: =0
                        Height: =If(scr_admin_refdata.Size = ScreenSize.Small, 102, 54)
                        LayoutAlignItems: =If(scr_admin_refdata.Size = ScreenSize.Small, LayoutAlignItems.Stretch, LayoutAlignItems.Center)
                        LayoutDirection: =If(scr_admin_refdata.Size = ScreenSize.Small, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - lblArTitle:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =UAB.TextPrimary
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =UABSize.ScreenTitle
                              Text: ="Reference data"
                        - conArTitleBtns:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =UAB.OffWhite
                              FillPortions: =0
                              Height: =40
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =If(scr_admin_refdata.Size = ScreenSize.Small, 208, 258)
                            Children:
                              - btnArBack:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Back to Settings"
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Secondary
                                    BasePaletteColor: =UAB.Green
                                    FontWeight: =""
                                    Height: =40
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: =Navigate(scr_settings)
                                    PaddingBottom: =5
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =5
                                    RadiusBottomLeft: =4
                                    RadiusBottomRight: =4
                                    RadiusTopLeft: =4
                                    RadiusTopRight: =4
                                    Text: ="Settings"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =If(scr_admin_refdata.Size = ScreenSize.Small, 90, 110)
                              - btnArNew:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Add a reference record"
                                    Align: =Align.Center
                                    BasePaletteColor: =UAB.Green
                                    FontWeight: =""
                                    Height: =40
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =Set(varArEditId, 0); Set(varArEditTitle, ""); Set(varArEditFlag, false); Set(varArEditDetail, ""); Set(varArEditOrder, 0);
                                      Reset(txtArDivTitle); Reset(txtArRankTitle); Reset(tglArRankPT);
                                      If(Coalesce(varArEntity, "Divisions") = "FacultyRanks", Set(varArShowRank, true), Set(varArShowDiv, true))
                                    PaddingBottom: =5
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =5
                                    RadiusBottomLeft: =4
                                    RadiusBottomRight: =4
                                    RadiusTopLeft: =4
                                    RadiusTopRight: =4
                                    Text: =If(varArEntity = "FacultyRanks", "Add rank", "Add division")
                                    VerticalAlign: =VerticalAlign.Middle
                                    Visible: =Coalesce(varArEntity, "Divisions") <> "Stages"
                                    Width: =If(scr_admin_refdata.Size = ScreenSize.Small, 110, 140)
                  - lblArSub:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =UAB.Gray500
                        Height: =23
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =UABSize.Secondary
                        Text: ="Divisions, faculty ranks, and pipeline stages. Stage order is fixed by the flows."
                        Wrap: =false
            - conArTabs:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.OffWhite
                  FillPortions: =0
                  Height: =40
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - btnArTabDiv:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Show divisions"
                        Align: =Align.Center
                        Appearance: =If(Coalesce(varArEntity, "Divisions") = "Divisions", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                        BasePaletteColor: =UAB.Green
                        FillPortions: =0
                        FontWeight: =""
                        Height: =36
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Set(varArEntity, "Divisions");
                          Select(btnArReload)
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Text: ="Divisions"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =If(scr_admin_refdata.Size = ScreenSize.Small, 90, 120)
                  - btnArTabRank:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Show faculty ranks"
                        Align: =Align.Center
                        Appearance: =If(Coalesce(varArEntity, "Divisions") = "FacultyRanks", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                        BasePaletteColor: =UAB.Green
                        FillPortions: =0
                        FontWeight: =""
                        Height: =36
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Set(varArEntity, "FacultyRanks");
                          Select(btnArReload)
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Text: ="Faculty ranks"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =If(scr_admin_refdata.Size = ScreenSize.Small, 110, 140)
                  - btnArTabStage:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Show stages"
                        Align: =Align.Center
                        Appearance: =If(Coalesce(varArEntity, "Divisions") = "Stages", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                        BasePaletteColor: =UAB.Green
                        FillPortions: =0
                        FontWeight: =""
                        Height: =36
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Set(varArEntity, "Stages");
                          Select(btnArReload)
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Text: ="Stages"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =If(scr_admin_refdata.Size = ScreenSize.Small, 80, 110)
            - lblArCount:
                Control: ModernText
                Properties:
                  Align: =Align.Right
                  AutoHeight: =true
                  Color: =UAB.Gray500
                  Height: =18
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Size: =UABSize.Secondary
                  Text: =CountRows(colArRows) & Switch(Coalesce(varArEntity, "Divisions"), "Divisions", " divisions", "FacultyRanks", " ranks", " stages")
                  Wrap: =false
            - conArTableCard:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =UAB.Line
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =UAB.White
                  FillPortions: =0
                  Height: =40 + Max(If(scr_admin_refdata.Size = ScreenSize.Small, 72, 56), Min(CountRows(colArRows), 10) * If(scr_admin_refdata.Size = ScreenSize.Small, 72, 56)) + If(CountRows(colArRows) = 0, 44, 0)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - conArHeaderRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =UAB.Paper
                        FillPortions: =0
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =If(scr_admin_refdata.Size = ScreenSize.Small, 8, 12)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingLeft: =If(scr_admin_refdata.Size = ScreenSize.Small, 12, 16)
                        PaddingRight: =If(scr_admin_refdata.Size = ScreenSize.Small, 12, 16)
                      Children:
                        - lblArColName:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =UAB.Gray700
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              Height: =18
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =UABSize.Secondary
                              Text: ="Name"
                        - conArColDetail:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =UAB.Paper
                              FillPortions: =0
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Visible: =!(scr_admin_refdata.Size = ScreenSize.Small) && varArEntity = "Stages"
                              Width: =If(scr_admin_refdata.Size = ScreenSize.Small || varArEntity <> "Stages", 0, 320)
                            Children:
                              - lblArColDetail:
