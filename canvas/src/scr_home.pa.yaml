Screens:
  scr_home:
    Properties:
      Fill: =UAB.OffWhite
      OnVisible: |-
        =Set(varHmFilter, Coalesce(varHmFilter, "All"));
        Set(varHmPage, 1);
        If(IsManagerOrHR,
            ClearCollect(colHmStages, SortByColumns(Filter(Stages, Coalesce(IsActive, true)), "OrderIndex"));
            ClearCollect(colHmCands,
                Filter(FirstN(Candidates, 500), CStatus.Value = "Active"
                    && (IsHR || Lower(Coalesce(Manager.Email, "")) = Lower(User().Email)
                        || Lower(Coalesce(PrimaryOwner.Email, "")) = Lower(User().Email)
                        || Lower(User().Email) in ForAll(Watchers, Lower(Email)))));
            // delegable: date < and choice = joined with Or; the result stays small
            ClearCollect(colHmOverdue, Filter(Tasks, DueDate < Today() && (TStatus.Value = "To Do" || TStatus.Value = "In Progress" || TStatus.Value = "Blocked")));
            ClearCollect(colHmRows,
                AddColumns(colHmCands,
                    OverdueN, With({cid: ID}, CountRows(Filter(colHmOverdue, Candidate.Id = cid))),
                    StartSort, Coalesce(StartDate, Date(2099, 12, 31)))),
            // Viewers: same filter My Tasks uses, so the counts agree with the screen the tiles open
            ClearCollect(colHmMine, Filter(Tasks, Assignee.Email = User().Email && (TStatus.Value = "To Do" || TStatus.Value = "In Progress" || TStatus.Value = "Blocked"))))
    Children:
      - NavRail_Home:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =UAB.Green
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =4
            PaddingBottom: =32
            PaddingTop: =32
            Width: =If(scr_home.Size = ScreenSize.Small, UABLayout.NavRailWidthCollapsed, UABLayout.NavRailWidth)
          Children:
            - lblAppName_Home:
                Control: Label
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =UAB.White
                  Font: =Font.Arial
                  FontWeight: =FontWeight.Bold
                  Height: =56
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =20
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =20
                  Text: ="OnBoardPro"
                  Visible: =scr_home.Size <> ScreenSize.Small
                  Wrap: =false
            - lblAppSub_Home:
