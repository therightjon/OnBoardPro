                                    Wrap: =false
                              - conTlWhenRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =UAB.White
                                    FillPortions: =2
                                    Height: =40
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - cmbTlWhen:
                                        Control: ModernCombobox
                                        Properties:
                                          DefaultSelectedItems: |-
                                            =Table({Value: If(Coalesce(varTlItem.OffsetDays, 0) < 0, "Before",
                                                Coalesce(varTlItem.OffsetDays, 0) > 0, "After", "On")})
                                          FillPortions: =1
                                          Height: =40
                                          ItemDisplayText: =ThisItem.Value
                                          Items: |-
                                            =Table({Value: "On"}, {Value: "Before"}, {Value: "After"})
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          SelectMultiple: =false
                                    - numTlOffset:
                                        Control: ModernNumberInput
                                        Properties:
                                          Default: =Abs(Coalesce(varTlItem.OffsetDays, 0))
                                          DisplayMode: =If(Coalesce(cmbTlWhen.Selected.Value, "On") = "On", DisplayMode.Disabled, DisplayMode.Edit)
                                          FillPortions: =1
                                          Height: =40
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                  - conTlRowPriority:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =UAB.White
                        FillPortions: =0
                        Height: =If(scr_tasklibrary.Size = ScreenSize.Small, 144, 66)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =If(scr_tasklibrary.Size = ScreenSize.Small, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - conTlFPriority:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =UAB.White
                              Height: =66
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - lblTlPriorityCap:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =UAB.Gray700
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =UABSize.Secondary
                                    Text: ="Priority"
                                    Wrap: =false
                              - cmbTlPriority:
                                  Control: ModernCombobox
                                  Properties:
                                    DefaultSelectedItems: =Filter(Choices(TaskLibrary.Priority), Value = Coalesce(varTlItem.Priority.Value, "Medium"))
                                    FillPortions: =1
                                    Height: =40
                                    ItemDisplayText: =ThisItem.Value
                                    Items: =Choices(TaskLibrary.Priority)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    SelectMultiple: =false
                        - conTlFActive:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =UAB.White
                              Height: =66
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - tglTlActive:
                                  Control: Toggle
                                  Properties:
                                    BasePaletteColor: =UAB.Green
                                    Checked: =Coalesce(varTlItem.IsActive, true)
                                    Height: =40
                                    Label: ="Active — offered in pickers"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                  - conTlRowFlags:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =UAB.White
                        FillPortions: =0
                        Height: =If(scr_tasklibrary.Size = ScreenSize.Small, 132, 44)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =If(scr_tasklibrary.Size = ScreenSize.Small, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                        LayoutGap: =If(scr_tasklibrary.Size = ScreenSize.Small, 4, 12)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - tglTlRequired:
                            Control: Toggle
                            Properties:
                              BasePaletteColor: =UAB.Green
                              Checked: =Coalesce(varTlItem.IsRequired, true)
                              FillPortions: =1
                              Height: =40
                              Label: ="Required"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                        - tglTlPrereq:
                            Control: Toggle
                            Properties:
                              BasePaletteColor: =UAB.Green
                              Checked: =Coalesce(varTlItem.IsPrereq, false)
                              FillPortions: =1
                              Height: =40
                              Label: ="Prereq"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                        - tglTlApproval:
                            Control: Toggle
                            Properties:
                              BasePaletteColor: =UAB.Green
                              Checked: =Coalesce(varTlItem.NeedsApproval, false)
                              FillPortions: =1
                              Height: =40
                              Label: ="Needs approval"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                  - conTlRowPrereqCond:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =UAB.White
                        FillPortions: =0
                        Height: =If(tglTlPrereq.Checked, 66, 0)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Visible: =tglTlPrereq.Checked
                      Children:
                        - lblTlPrereqCondCap:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =UAB.Gray700
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =UABSize.Secondary
                              Text: ="Prereq applies"
                              Wrap: =false
                        - cmbTlPrereqCond:
                            Control: ModernCombobox
                            Properties:
                              DefaultSelectedItems: =Filter(Choices(TaskLibrary.PrereqCondition), Value = Coalesce(varTlItem.PrereqCondition.Value, "Always"))
                              FillPortions: =1
                              Height: =40
                              ItemDisplayText: =ThisItem.Value
                              Items: =Choices(TaskLibrary.PrereqCondition)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              SelectMultiple: =false
                  - conTlActions:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =UAB.White
                        FillPortions: =0
                        Height: =48
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - btnTlSave:
                            Control: ModernButton
                            Properties:
                              Align: =Align.Center
                              BasePaletteColor: =UAB.Green
                              DisplayMode: =If(!IsBlank(Trim(txtTlTitle.Text)), DisplayMode.Edit, DisplayMode.Disabled)
                              FontWeight: =""
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =IfError(
                                    If(IsBlank(varTlItem),
                                        Patch(TaskLibrary, Defaults(TaskLibrary),
                                            {Title: Trim(txtTlTitle.Text),
                                             Description: txtTlDesc.Text,
                                             Category: If(IsBlank(cmbTlCategory.Selected), Blank(), {Value: cmbTlCategory.Selected.Value}),
                                             AssigneeRole: If(IsBlank(cmbTlRole.Selected), Blank(), {Value: cmbTlRole.Selected.Value}),
                                             Anchor: If(IsBlank(cmbTlAnchor.Selected), Blank(), {Value: cmbTlAnchor.Selected.Value}),
                                             OffsetDays: If(Coalesce(cmbTlWhen.Selected.Value, "On") = "On", 0,
                                                 Coalesce(cmbTlWhen.Selected.Value, "") = "Before", -Abs(numTlOffset.Value),
                                                 Abs(numTlOffset.Value)),
                                             Priority: If(IsBlank(cmbTlPriority.Selected), Blank(), {Value: cmbTlPriority.Selected.Value}),
                                             IsRequired: tglTlRequired.Checked,
                                             IsPrereq: tglTlPrereq.Checked,
                                             NeedsApproval: tglTlApproval.Checked,
                                             PrereqCondition: If(!tglTlPrereq.Checked, Blank(),
                                                 If(IsBlank(cmbTlPrereqCond.Selected), {Value: "Always"}, {Value: cmbTlPrereqCond.Selected.Value})),
                                             IsActive: tglTlActive.Checked}),
                                        Patch(TaskLibrary, varTlItem,
                                            {Title: Trim(txtTlTitle.Text),
                                             Description: txtTlDesc.Text,
                                             Category: If(IsBlank(cmbTlCategory.Selected), Blank(), {Value: cmbTlCategory.Selected.Value}),
                                             AssigneeRole: If(IsBlank(cmbTlRole.Selected), Blank(), {Value: cmbTlRole.Selected.Value}),
                                             Anchor: If(IsBlank(cmbTlAnchor.Selected), Blank(), {Value: cmbTlAnchor.Selected.Value}),
                                             OffsetDays: If(Coalesce(cmbTlWhen.Selected.Value, "On") = "On", 0,
                                                 Coalesce(cmbTlWhen.Selected.Value, "") = "Before", -Abs(numTlOffset.Value),
                                                 Abs(numTlOffset.Value)),
                                             Priority: If(IsBlank(cmbTlPriority.Selected), Blank(), {Value: cmbTlPriority.Selected.Value}),
                                             IsRequired: tglTlRequired.Checked,
                                             IsPrereq: tglTlPrereq.Checked,
                                             NeedsApproval: tglTlApproval.Checked,
                                             PrereqCondition: If(!tglTlPrereq.Checked, Blank(),
                                                 If(IsBlank(cmbTlPrereqCond.Selected), {Value: "Always"}, {Value: cmbTlPrereqCond.Selected.Value})),
                                             IsActive: tglTlActive.Checked})),
                                    Notify("Couldn't save the library task - " & FirstError.Message
                                        & " Nothing was changed. Try again.", NotificationType.Error),
                                    Set(varTlShow, false);
                                    Notify("Library task saved.", NotificationType.Success))
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: ="Save Task"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =140
                        - btnTlCancel:
                            Control: ModernButton
                            Properties:
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Secondary
                              BasePaletteColor: =UAB.Green
                              FillPortions: =1
                              FontWeight: =""
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(varTlShow, false)
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: ="Cancel"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =120
                        - btnTlDelete:
                            Control: ModernButton
                            Properties:
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Secondary
                              BasePaletteColor: =UAB.Danger
                              FontWeight: =""
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(varTlConfirmDelete, true)
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: ="Delete"
                              VerticalAlign: =VerticalAlign.Middle
                              Visible: =!IsBlank(varTlItem)
                              Width: =110
                  - lblTlModalSpacer:
                      Control: ModernText
                      Properties:
                        Align: =Align.Center
                        Color: =UAB.White
                        Height: =5
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =2
                        Text: =""
                        Wrap: =false
      - conTlConfirm:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(32, 38, 45, 0.4)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Center
            Visible: =Coalesce(varTlConfirmDelete, false)
            Width: =Parent.Width
          Children:
            - conTlConfirmPanel:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  DropShadow: =DropShadow.Regular
                  Fill: =UAB.White
                  FillPortions: =0
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =24
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =24
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =Min(440, Parent.Width - 32)
                Children:
                  - lblTlConfirmTitle:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =UAB.TextPrimary
                        FontWeight: =FontWeight.Semibold
                        Height: =30
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =20
                        Text: ="Delete This Library Task?"
                        Wrap: =false
                  - lblTlConfirmBody:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =UAB.Gray700
                        Height: =66
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =UABSize.Body
                        Text: |-
                          ="Remove " & Coalesce(varTlItem.Title, "this task")
                              & " from the library? Templates that already copied it are not affected. To just hide it from pickers, mark it Retired instead."
                  - conTlConfirmActions:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =UAB.White
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - btnTlConfirmDelete:
                            Control: ModernButton
                            Properties:
                              Align: =Align.Center
                              BasePaletteColor: =UAB.Danger
                              FontWeight: =""
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =IfError(
                                    RemoveIf(TaskLibrary, ID = varTlItem.ID),
                                    Notify("Couldn't delete the library task - " & FirstError.Message
                                        & " Nothing was deleted. Try again.", NotificationType.Error),
                                    Set(varTlConfirmDelete, false);
                                    Set(varTlShow, false);
                                    Notify("Library task deleted.", NotificationType.Success))
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: ="Delete Task"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =150
                        - btnTlConfirmCancel:
                            Control: ModernButton
                            Properties:
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Secondary
                              BasePaletteColor: =UAB.Green
                              FillPortions: =1
                              FontWeight: =""
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(varTlConfirmDelete, false)
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: ="Keep It"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =120
