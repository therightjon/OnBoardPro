Screens:
  scr_tasklibrary:
    Properties:
      Fill: =UAB.OffWhite
      OnVisible: =Set(varTlPage, 1)
    Children:
      - NavRail_TaskLib:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =UAB.Green
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =4
            PaddingBottom: =32
            PaddingTop: =32
            Width: =If(scr_tasklibrary.Size = ScreenSize.Small, UABLayout.NavRailWidthCollapsed, UABLayout.NavRailWidth)
          Children:
            - lblAppName_TaskLib:
                Control: Label
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =UAB.White
                  Font: =Font.Arial
                  FontWeight: =FontWeight.Bold
                  Height: =56
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =20
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =20
                  Text: ="OnBoardPro"
                  Visible: =scr_tasklibrary.Size <> ScreenSize.Small
                  Wrap: =false
            - lblAppSub_TaskLib:
                Control: Label
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =UAB.Gold
                  Font: =Font.Arial
                  Height: =24
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =20
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =11
                  Text: ="OBGYN Onboarding"
                  Visible: =scr_tasklibrary.Size <> ScreenSize.Small
                  Wrap: =false
            - conNavNewCand_TaskLib:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.Green
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =IsHR
                Children:
                  - conNavBarNewCand_TaskLib:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =If(App.ActiveScreen = scr_new_candidate, UAB.Gold, RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =4
                  - icoNavNewCand_TaskLib:
                      Control: Classic/Icon
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Color: =If(App.ActiveScreen = scr_new_candidate, UAB.White, UAB.NavInactive)
                        Height: =44
                        Icon: =Icon.Add
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_new_candidate)
                        PaddingLeft: =12
                        Width: =44
                  - lblNavNewCand_TaskLib:
                      Control: Label
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =If(App.ActiveScreen = scr_new_candidate, UAB.White, UAB.NavInactive)
                        FillPortions: =1
                        Font: =Font.Arial
                        FontWeight: =If(App.ActiveScreen = scr_new_candidate, FontWeight.Semibold, FontWeight.Normal)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_new_candidate)
                        PaddingBottom: =0
                        PaddingLeft: =8
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =UABSize.Body
                        Text: ="New Candidate"
                        Visible: =scr_tasklibrary.Size <> ScreenSize.Small
                        Wrap: =false
            - conNavCandidates_TaskLib:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.Green
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =IsManagerOrHR
                Children:
                  - conNavBarCandidates_TaskLib:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =If(App.ActiveScreen = scr_candidates, UAB.Gold, RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =4
                  - icoNavCandidates_TaskLib:
                      Control: Classic/Icon
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Color: =If(App.ActiveScreen = scr_candidates, UAB.White, UAB.NavInactive)
                        Height: =44
                        Icon: =Icon.People
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_candidates)
                        PaddingLeft: =12
                        Width: =44
                  - lblNavCandidates_TaskLib:
                      Control: Label
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =If(App.ActiveScreen = scr_candidates, UAB.White, UAB.NavInactive)
                        FillPortions: =1
                        Font: =Font.Arial
                        FontWeight: =If(App.ActiveScreen = scr_candidates, FontWeight.Semibold, FontWeight.Normal)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_candidates)
                        PaddingBottom: =0
                        PaddingLeft: =8
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =UABSize.Body
                        Text: ="Candidates"
                        Visible: =scr_tasklibrary.Size <> ScreenSize.Small
                        Wrap: =false
            - conNavMyTasks_TaskLib:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.Green
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - conNavBarMyTasks_TaskLib:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =If(App.ActiveScreen = scr_mytasks, UAB.Gold, RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =4
                  - icoNavMyTasks_TaskLib:
                      Control: Classic/Icon
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Color: =If(App.ActiveScreen = scr_mytasks, UAB.White, UAB.NavInactive)
                        Height: =44
                        Icon: =Icon.Check
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_mytasks)
                        PaddingLeft: =12
                        Width: =44
                  - lblNavMyTasks_TaskLib:
                      Control: Label
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =If(App.ActiveScreen = scr_mytasks, UAB.White, UAB.NavInactive)
                        FillPortions: =1
                        Font: =Font.Arial
                        FontWeight: =If(App.ActiveScreen = scr_mytasks, FontWeight.Semibold, FontWeight.Normal)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_mytasks)
                        PaddingBottom: =0
                        PaddingLeft: =8
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =UABSize.Body
                        Text: ="My Tasks"
                        Visible: =scr_tasklibrary.Size <> ScreenSize.Small
                        Wrap: =false
            - conNavTemplates_TaskLib:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.Green
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =IsHR
                Children:
                  - conNavBarTemplates_TaskLib:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =If(App.ActiveScreen = scr_templates, UAB.Gold, RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =4
                  - icoNavTemplates_TaskLib:
                      Control: Classic/Icon
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Color: =If(App.ActiveScreen = scr_templates, UAB.White, UAB.NavInactive)
                        Height: =44
                        Icon: =Icon.DocumentWithContent
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_templates)
                        PaddingLeft: =12
                        Width: =44
                  - lblNavTemplates_TaskLib:
                      Control: Label
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =If(App.ActiveScreen = scr_templates, UAB.White, UAB.NavInactive)
                        FillPortions: =1
                        Font: =Font.Arial
                        FontWeight: =If(App.ActiveScreen = scr_templates, FontWeight.Semibold, FontWeight.Normal)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_templates)
                        PaddingBottom: =0
                        PaddingLeft: =8
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =UABSize.Body
                        Text: ="Templates"
                        Visible: =scr_tasklibrary.Size <> ScreenSize.Small
                        Wrap: =false
            - conNavTaskLib_TaskLib:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.Green
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =IsHR
                Children:
                  - conNavBarTaskLib_TaskLib:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =If(App.ActiveScreen = scr_tasklibrary, UAB.Gold, RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =4
                  - icoNavTaskLib_TaskLib:
                      Control: Classic/Icon
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Color: =If(App.ActiveScreen = scr_tasklibrary, UAB.White, UAB.NavInactive)
                        Height: =44
                        Icon: =Icon.Notebook
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_tasklibrary)
                        PaddingLeft: =12
                        Width: =44
                  - lblNavTaskLib_TaskLib:
                      Control: Label
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =If(App.ActiveScreen = scr_tasklibrary, UAB.White, UAB.NavInactive)
                        FillPortions: =1
                        Font: =Font.Arial
                        FontWeight: =If(App.ActiveScreen = scr_tasklibrary, FontWeight.Semibold, FontWeight.Normal)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_tasklibrary)
                        PaddingBottom: =0
                        PaddingLeft: =8
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =UABSize.Body
                        Text: ="Task Library"
                        Visible: =scr_tasklibrary.Size <> ScreenSize.Small
                        Wrap: =false
      - cntTaskLibRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =UAB.OffWhite
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =24
            PaddingLeft: =If(scr_tasklibrary.Size = ScreenSize.Small, 12, 24)
            PaddingRight: =If(scr_tasklibrary.Size = ScreenSize.Small, 12, 24)
            PaddingTop: =24
            Width: =Parent.Width - If(scr_tasklibrary.Size = ScreenSize.Small, UABLayout.NavRailWidthCollapsed, UABLayout.NavRailWidth)
            X: =If(scr_tasklibrary.Size = ScreenSize.Small, UABLayout.NavRailWidthCollapsed, UABLayout.NavRailWidth)
          Children:
            - cntTlHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.OffWhite
                  FillPortions: =0
                  Height: =92
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - conTlTitleRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =UAB.OffWhite
                        FillPortions: =0
                        Height: =54
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - lblTlTitle:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =UAB.TextPrimary
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =UABSize.ScreenTitle
                              Text: ="Task Library"
                        - btnTlNew:
                            Control: ModernButton
                            Properties:
                              Align: =Align.Center
                              BasePaletteColor: =UAB.Green
                              FontWeight: =""
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varTlItem, Blank());
                                Set(varTlShow, true);
                                Reset(txtTlTitle); Reset(txtTlDesc); Reset(cmbTlCategory); Reset(cmbTlRole);
                                Reset(cmbTlAnchor); Reset(cmbTlWhen); Reset(numTlOffset); Reset(cmbTlPriority);
                                Reset(tglTlRequired); Reset(tglTlPrereq); Reset(cmbTlPrereqCond);
                                Reset(tglTlApproval); Reset(tglTlActive)
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: =If(scr_tasklibrary.Size = ScreenSize.Small, "New Task", "New Library Task")
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =If(scr_tasklibrary.Size = ScreenSize.Small, 120, 180)
                  - lblTlSub:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =UAB.Gray500
                        Height: =23
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =UABSize.Secondary
                        Text: ="Standard task definitions to reuse in any template. Retiring a task hides it from pickers without touching templates that already use it."
                        Wrap: =false
            - conTlFilterRow:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.OffWhite
                  FillPortions: =0
                  Height: =If(scr_tasklibrary.Size = ScreenSize.Small, 184, 40)
                  LayoutAlignItems: =If(scr_tasklibrary.Size = ScreenSize.Small, LayoutAlignItems.Stretch, LayoutAlignItems.Center)
                  LayoutDirection: =If(scr_tasklibrary.Size = ScreenSize.Small, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - txtTlSearch:
                      Control: ModernTextInput
                      Properties:
                        FillPortions: =2
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Placeholder: ="Search library tasks"
                  - cmbTlCat:
                      Control: ModernCombobox
                      Properties:
                        FillPortions: =1
                        Height: =40
                        ItemDisplayText: =ThisItem.Value
                        Items: =Choices(TaskLibrary.Category)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        SelectMultiple: =false
                  - tglTlRetired:
                      Control: Toggle
                      Properties:
                        BasePaletteColor: =UAB.Green
                        Height: =40
                        Label: ="Show retired"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =If(scr_tasklibrary.Size = ScreenSize.Small, 160, 175)
                  - btnTlClear:
                      Control: ModernButton
                      Properties:
                        Align: =Align.Center
                        Appearance: =ButtonAppearance.Secondary
                        BasePaletteColor: =UAB.Green
                        FontWeight: =""
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Reset(txtTlSearch); Reset(cmbTlCat); Reset(tglTlRetired);
                          Set(varTlPage, 1)
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Text: ="Clear"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =If(scr_tasklibrary.Size = ScreenSize.Small, 90, 90)
            - lblTlCount:
                Control: ModernText
                Properties:
                  Align: =Align.Right
                  AutoHeight: =true
                  Color: =UAB.Gray500
                  Height: =18
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Size: =UABSize.Secondary
                  Text: =galTlAll.AllItemsCount & If(galTlAll.AllItemsCount = 1, " task", " tasks")
                  Wrap: =false
            - conTlTableCard:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =UAB.Line
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =UAB.White
                  FillPortions: =0
                  Height: =40 + Max(If(scr_tasklibrary.Size = ScreenSize.Small, 72, 56), Min(galTlAll.AllItemsCount, 8) * If(scr_tasklibrary.Size = ScreenSize.Small, 72, 56)) + If(galTlAll.AllItemsCount > 8, 48, 0) + If(galTlAll.AllItemsCount = 0, 44, 0)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - conTlHeaderRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =UAB.Paper
                        FillPortions: =0
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =If(scr_tasklibrary.Size = ScreenSize.Small, 8, 12)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingLeft: =If(scr_tasklibrary.Size = ScreenSize.Small, 12, 16)
                        PaddingRight: =If(scr_tasklibrary.Size = ScreenSize.Small, 12, 16)
                      Children:
                        - lblTlColTask:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =UAB.Gray700
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              Height: =18
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =UABSize.Secondary
                              Text: ="Task"
                        - conTlColCat:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =UAB.Paper
                              FillPortions: =0
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Visible: =!(scr_tasklibrary.Size = ScreenSize.Small)
                              Width: =If(scr_tasklibrary.Size = ScreenSize.Small, 0, 120)
                            Children:
                              - lblTlColCat:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    Color: =UAB.Gray700
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    Height: =18
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =UABSize.Secondary
                                    Text: ="Category"
                        - conTlColTiming:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =UAB.Paper
                              FillPortions: =0
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Visible: =!(scr_tasklibrary.Size = ScreenSize.Small)
                              Width: =If(scr_tasklibrary.Size = ScreenSize.Small, 0, 150)
                            Children:
                              - lblTlColTiming:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    Color: =UAB.Gray700
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    Height: =18
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =UABSize.Secondary
                                    Text: ="Timing"
                        - conTlColRole:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =UAB.Paper
                              FillPortions: =0
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Visible: =!(scr_tasklibrary.Size = ScreenSize.Small)
                              Width: =If(scr_tasklibrary.Size = ScreenSize.Small, 0, 110)
                            Children:
                              - lblTlColRole:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    Color: =UAB.Gray700
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    Height: =18
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =UABSize.Secondary
                                    Text: ="Assigned to"
                        - conTlColFlags:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =UAB.Paper
                              FillPortions: =0
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Visible: =!(scr_tasklibrary.Size = ScreenSize.Small)
                              Width: =If(scr_tasklibrary.Size = ScreenSize.Small, 0, 150)
                            Children:
                              - lblTlColFlags:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    Color: =UAB.Gray700
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    Height: =18
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =UABSize.Secondary
                                    Text: ="Flags"
                        - conTlColActive:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =UAB.Paper
                              FillPortions: =0
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =If(scr_tasklibrary.Size = ScreenSize.Small, 70, 90)
                            Children:
                              - lblTlColActive:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    Color: =UAB.Gray700
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    Height: =18
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =UABSize.Secondary
                                    Text: ="Status"
                  - galTlAll:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        FillPortions: =0
                        Height: =56
                        Items: |-
                          =SortByColumns(
                              Filter(FirstN(TaskLibrary, 500),
                                  (IsBlank(Trim(txtTlSearch.Text))
                                      || StartsWith(Title, Trim(txtTlSearch.Text))
                                      || Trim(txtTlSearch.Text) in Title),
                                  (IsBlank(cmbTlCat.Selected) || Category.Value = cmbTlCat.Selected.Value),
                                  (tglTlRetired.Checked || IsActive = true)),
                              "Title", SortOrder.Ascending)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        ShowScrollbar: =false
                        TemplatePadding: =0
                        TemplateSize: =56
                        Visible: =false
                      Children:
                        - lblTlAllStub:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Height: =18
                              Text: =""
                  - galTlList:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        Fill: =UAB.White
                        FillPortions: =0
                        Height: =Max(If(scr_tasklibrary.Size = ScreenSize.Small, 72, 56), Min(galTlAll.AllItemsCount, 8) * If(scr_tasklibrary.Size = ScreenSize.Small, 72, 56))
                        Items: |-
                          =With({t: galTlAll.AllItems, n: galTlAll.AllItemsCount},
                              FirstN(LastN(t, n - (Min(Coalesce(varTlPage, 1), Max(1, RoundUp(n / 8, 0))) - 1) * 8), 8))
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        ShowScrollbar: =false
                        TemplatePadding: =0
                        TemplateSize: =If(scr_tasklibrary.Size = ScreenSize.Small, 72, 56)
                      Children:
                        - conTlListRow:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =UAB.White
                              Height: =Parent.TemplateHeight
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              Width: =Parent.TemplateWidth
                            Children:
                              - conTlRowContent:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =UAB.White
                                    FillPortions: =0
                                    Height: =If(scr_tasklibrary.Size = ScreenSize.Small, 71, 55)
                                    LayoutAlignItems: =LayoutAlignItems.Center
