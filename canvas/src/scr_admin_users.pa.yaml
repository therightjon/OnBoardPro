                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =UABSize.Secondary
                                    Text: ="Division (optional)"
                                    Wrap: =false
                              - cmbAuDivision:
                                  Control: ModernCombobox
                                  Properties:
                                    AccessibleLabel: ="Division"
                                    DefaultSelectedItems: =Filter(Divisions, ID = Coalesce(varAuEditDivId, 0))
                                    FillPortions: =1
                                    Height: =40
                                    InputTextPlaceholder: ="All divisions"
                                    ItemDisplayText: =ThisItem.Title
                                    Items: =SortByColumns(Divisions, "Title")
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    SelectMultiple: =false
                  - conAuRowChannel:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =UAB.White
                        FillPortions: =0
                        Height: =66
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - lblAuChanCap:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =UAB.Gray700
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =UABSize.Secondary
                              Text: ="Notifications"
                              Wrap: =false
                        - cmbAuChannel:
                            Control: ModernCombobox
                            Properties:
                              AccessibleLabel: ="Notifications"
                              DefaultSelectedItems: =[Coalesce(varAuEditChan, "Email")]
                              FillPortions: =1
                              Height: =40
                              ItemDisplayText: =ThisItem.Value
                              Items: =["Email", "Teams", "Email + Teams"]
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              SelectMultiple: =false
                  - conAuActions:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =UAB.White
                        FillPortions: =0
                        Height: =48
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - btnAuSave:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Save this user"
                              Align: =Align.Center
                              BasePaletteColor: =UAB.Green
                              FontWeight: =""
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =With({mode: Coalesce(varAuMode, "add"),
                                       mail: Lower(Coalesce(cmbAuUser.Selected.Mail, cmbAuUser.Selected.UserPrincipalName, "")),
                                       dupe: If(Coalesce(varAuMode, "add") = "add",
                                                !IsBlank(LookUp(AppPermissions,
                                                    Lower(Coalesce(AppUser.Email, "")) = Lower(Coalesce(cmbAuUser.Selected.Mail, cmbAuUser.Selected.UserPrincipalName, "")))),
                                                false)},
                                    If(mode = "add" && IsBlank(cmbAuUser.Selected),
                                        Notify("Pick a user.", NotificationType.Warning),
                                       mode = "add" && dupe,
                                        Notify("That person already has a row - edit it instead.", NotificationType.Warning),
                                       IsBlank(cmbAuRole1.Selected),
                                        Notify("Pick a role.", NotificationType.Warning),
                                       mode = "edit" && Lower(Coalesce(varAuEditEmail, "")) = Lower(User().Email) && cmbAuRole1.Selected.Value <> "HR",
                                        Notify("You can't change your own role.", NotificationType.Warning),
                                       IfError(
                                           If(mode = "add",
                                              Patch(AppPermissions, Defaults(AppPermissions),
                                                  {Title: cmbAuUser.Selected.DisplayName,
                                                   AppUser: {Claims: "i:0#.f|membership|" & mail, Department: "",
                                                             DisplayName: cmbAuUser.Selected.DisplayName, Email: mail,
                                                             JobTitle: "", Picture: ""},
                                                   Role: {Value: cmbAuRole1.Selected.Value},
                                                   NotifyChannel: {Value: Coalesce(cmbAuChannel.Selected.Value, "Email")},
                                                   Division: If(IsBlank(cmbAuDivision.Selected), Blank(),
                                                       {Id: cmbAuDivision.Selected.ID, Value: cmbAuDivision.Selected.Title})}),
                                              Patch(AppPermissions, LookUp(AppPermissions, ID = varAuEditId),
                                                  {Title: Coalesce(varAuEditName, ""),
                                                   Role: {Value: cmbAuRole1.Selected.Value},
                                                   NotifyChannel: {Value: Coalesce(cmbAuChannel.Selected.Value, "Email")},
                                                   Division: If(IsBlank(cmbAuDivision.Selected), Blank(),
                                                       {Id: cmbAuDivision.Selected.ID, Value: cmbAuDivision.Selected.Title})})),
                                           Notify("Couldn't save: " & FirstError.Message & " Your changes are still on screen - try Save again.", NotificationType.Error),
                                           Set(varAuShow, false);
                                           Notify(If(mode = "add", "User added.", "User updated."), NotificationType.Success))))
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: ="Save"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =140
                        - btnAuCancel:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Cancel and close the user editor"
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Secondary
                              BasePaletteColor: =UAB.Green
                              FillPortions: =1
                              FontWeight: =""
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(varAuShow, false)
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: ="Cancel"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =120
      - conAuConfirm:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(32, 38, 45, 0.4)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Center
            Visible: =Coalesce(varAuShowConfirm, false)
            Width: =Parent.Width
          Children:
            - conAuConfirmPanel:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  DropShadow: =DropShadow.Regular
                  Fill: =UAB.White
                  FillPortions: =0
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =24
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =24
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =Min(440, Parent.Width - 32)
                Children:
                  - lblAuConfirmTitle:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =UAB.TextPrimary
                        FontWeight: =FontWeight.Semibold
                        Height: =30
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =20
                        Text: ="Remove " & Coalesce(varAuDelName, "this user") & "?"
                        Wrap: =false
                  - lblAuConfirmBody:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =UAB.Gray700
                        Height: =66
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =UABSize.Body
                        Text: |-
                          =If(Lower(Coalesce(varAuDelEmail, "")) = Lower(User().Email),
                              "You can't remove your own access. Another HR user can.",
                              "They'll drop to Viewer the next time they open the app. Their group membership is unchanged.")
                  - conAuConfirmActions:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =UAB.White
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - btnAuConfirmDelete:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Remove this user's access"
                              Align: =Align.Center
                              BasePaletteColor: =UAB.Danger
                              DisplayMode: =If(Lower(Coalesce(varAuDelEmail, "")) = Lower(User().Email), DisplayMode.Disabled, DisplayMode.Edit)
                              FontWeight: =""
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =IfError(
                                    Remove(AppPermissions, LookUp(AppPermissions, ID = varAuDelId)),
                                    Notify("Couldn't remove: " & FirstError.Message, NotificationType.Error),
                                    Set(varAuShowConfirm, false);
                                    Notify("User removed.", NotificationType.Success))
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: ="Remove"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =150
                        - btnAuConfirmCancel:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Keep this user and close the dialog"
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Secondary
                              BasePaletteColor: =UAB.Green
                              FillPortions: =1
                              FontWeight: =""
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(varAuShowConfirm, false)
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: ="Cancel"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =120
