                              DropShadow: =DropShadow.None
                              Fill: =UAB.Paper
                              FillPortions: =0
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Visible: =!(scr_admin_users.Size = ScreenSize.Small)
                              Width: =If(scr_admin_users.Size = ScreenSize.Small, 0, 260)
                            Children:
                              - lblAuColEmail:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Center
                                    AutoHeight: =true
                                    Color: =UAB.Gray700
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    Height: =18
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =UABSize.Secondary
                                    Text: ="Email"
                        - conAuColRole:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =UAB.Paper
                              FillPortions: =0
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =110
                            Children:
                              - lblAuColRole:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Center
                                    AutoHeight: =true
                                    Color: =UAB.Gray700
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    Height: =18
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =UABSize.Secondary
                                    Text: ="Role"
