                        AutoHeight: =true
                        Color: =UAB.Gray500
                        Height: =23
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =UABSize.Secondary
                        Text: ="Who can open the app, what they see, and where their notifications go."
                        Wrap: =false
            - conAuFilterRow:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.OffWhite
                  FillPortions: =0
                  Height: =If(scr_admin_users.Size = ScreenSize.Small, 136, 40)
                  LayoutAlignItems: =If(scr_admin_users.Size = ScreenSize.Small, LayoutAlignItems.Stretch, LayoutAlignItems.Center)
                  LayoutDirection: =If(scr_admin_users.Size = ScreenSize.Small, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - txtAuSearch:
                      Control: ModernTextInput
                      Properties:
                        AccessibleLabel: ="Search name or email"
                        FillPortions: =0
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: =Set(varAuPage, 1)
                        Placeholder: ="Search name or email"
                        Width: =If(scr_admin_users.Size = ScreenSize.Small, 160, 260)
                  - cmbAuRole:
                      Control: ModernCombobox
                      Properties:
                        AccessibleLabel: ="Filter by role"
                        FillPortions: =0
                        Height: =40
                        InputTextPlaceholder: ="Role"
                        ItemDisplayText: =ThisItem.Value
                        Items: =["HR", "Manager", "Viewer"]
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: =Set(varAuPage, 1)
                        SelectMultiple: =true
                        Width: =If(scr_admin_users.Size = ScreenSize.Small, 120, 180)
                  - btnAuClear:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Clear the user filters"
                        Align: =Align.Center
                        Appearance: =ButtonAppearance.Secondary
                        BasePaletteColor: =UAB.Green
                        FontWeight: =""
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Reset(txtAuSearch); Reset(cmbAuRole);
                          Set(varAuPage, 1)
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Text: ="Clear"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =90
            - lblAuCount:
                Control: ModernText
                Properties:
                  Align: =Align.Right
                  AutoHeight: =true
                  Color: =UAB.Gray500
                  Height: =18
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Size: =UABSize.Secondary
                  Text: =galAuAll.AllItemsCount & If(galAuAll.AllItemsCount = 1, " user", " users")
