                Variant: AutoLayout
                Properties:
                  BorderColor: =UAB.Line
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =UAB.White
                  FillPortions: =0
                  Height: =40 + Max(If(scr_admin_users.Size = ScreenSize.Small, 72, 56), Min(galAuAll.AllItemsCount, 7) * If(scr_admin_users.Size = ScreenSize.Small, 72, 56)) + If(galAuAll.AllItemsCount > 7, 48, 0) + If(galAuAll.AllItemsCount = 0, 44, 0)
