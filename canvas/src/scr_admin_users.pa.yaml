                              AutoHeight: =true
                              Color: =UAB.TextPrimary
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =UABSize.ScreenTitle
                              Text: ="Users & roles"
                        - conAuTitleBtns:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =UAB.OffWhite
                              FillPortions: =0
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =238
                            Children:
                              - btnAuBack:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Back to Settings"
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Secondary
                                    BasePaletteColor: =UAB.Green
                                    FontWeight: =""
                                    Height: =36
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: =Navigate(scr_settings)
                                    PaddingBottom: =5
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =5
                                    RadiusBottomLeft: =4
                                    RadiusBottomRight: =4
                                    RadiusTopLeft: =4
                                    RadiusTopRight: =4
                                    Text: ="Settings"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =110
                              - btnAuNew:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Add a user to the app"
                                    Align: =Align.Center
                                    BasePaletteColor: =UAB.Green
                                    FontWeight: =""
                                    Height: =36
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =Set(varAuMode, "add"); Set(varAuEditId, 0); Set(varAuEditName, ""); Set(varAuEditEmail, "");
                                      Set(varAuEditRole, "Viewer"); Set(varAuEditDivId, 0); Set(varAuEditChan, "Email");
                                      Reset(cmbAuUser); Reset(cmbAuRole1); Reset(cmbAuDivision); Reset(cmbAuChannel);
                                      Set(varAuShow, true)
                                    PaddingBottom: =5
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =5
                                    RadiusBottomLeft: =4
                                    RadiusBottomRight: =4
                                    RadiusTopLeft: =4
                                    RadiusTopRight: =4
                                    Text: ="Add user"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =120
                  - lblAuSub:
                      Control: ModernText
