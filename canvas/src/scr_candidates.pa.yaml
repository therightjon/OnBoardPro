                              Notify("Couldn't update the status - " & FirstError.Message
                                  & " Nothing changed. Try again.", NotificationType.Error),
                              Notify(varTkStatusTask.Title & " is now Done.",
                                  NotificationType.Success));
                          Set(varTkStatusShow, false)
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Text: ="Done"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =Parent.Width - 48
                  - btnTkStCanceled:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Set this task to Canceled"
                        Align: =Align.Center
                        Appearance: =ButtonAppearance.Secondary
                        BasePaletteColor: =UAB.Green
                        DisplayMode: |-
                          =If(Or(Coalesce(varTkStatusTask.TStatus.Value, "To Do") = "Canceled",
                                 IsBlank(Trim(txtTkCancelReason.Text))),
                              DisplayMode.Disabled, DisplayMode.Edit)
                        FontWeight: =""
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =IfError(
                              Patch(Tasks, LookUp(Tasks, ID = varTkStatusTask.ID),
                                  {TStatus: {Value: "Canceled"},
                                   CompletedDate: If("Canceled" = "Done", Today(), Blank()),
                                   CancelReason: If("Canceled" = "Canceled", Trim(txtTkCancelReason.Text),
                                       varTkStatusTask.CancelReason),
                                   UpdatedVia: "App"}),
                              Notify("Couldn't update the status - " & FirstError.Message
                                  & " Nothing changed. Try again.", NotificationType.Error),
                              Notify(varTkStatusTask.Title & " is now Canceled.",
                                  NotificationType.Success));
                          Set(varTkStatusShow, false)
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Text: ="Canceled"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =Parent.Width - 48
                  - lblTkStReasonCap:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =UAB.Gray700
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =UABSize.Secondary
                        Text: ="Reason (required to cancel)"
                        Wrap: =false
                  - txtTkCancelReason:
                      Control: ModernTextInput
                      Properties:
                        AccessibleLabel: ="Reason, required to cancel"
                        Height: =36
                        LayoutMinHeight: =36
                        LayoutMinWidth: =0
                        Placeholder: ="Why is this being canceled?"
                  - btnTkStClose:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Close the status picker"
                        Align: =Align.Center
                        Appearance: =ButtonAppearance.Secondary
                        BasePaletteColor: =UAB.Green
                        FontWeight: =""
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Set(varTkStatusShow, false)
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Text: ="Close"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =120
      - conTaModal:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(32, 38, 45, 0.4)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Center
            Visible: =Coalesce(varTaShow, false)
            Width: =Parent.Width
          Children:
            - conTaPanel:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  DropShadow: =DropShadow.Regular
                  Fill: =UAB.White
                  FillPortions: =0
                  Height: =560
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =24
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =24
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =Min(520, Parent.Width - 32)
                Children:
                  - lblTaTitle:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =UAB.TextPrimary
                        FontWeight: =FontWeight.Semibold
                        Height: =34
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =20
                        Text: ="Add a Task"
                        Wrap: =false
                  - lblTaSub:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =UAB.Gray500
                        Height: =38
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =UABSize.Secondary
                        Text: |-
                          ="This task belongs to " & Coalesce(FriendlyName(LookUp(Candidates, ID = Coalesce(varSelCandId, 0)).Title), "this candidate")
                              & " only. It is not added to the template."
                  - lblTaTitleCap:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =UAB.Gray700
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =UABSize.Secondary
                        Text: ="Task name"
                        Wrap: =false
                  - txtTaTitle:
                      Control: ModernTextInput
                      Properties:
                        AccessibleLabel: ="Task name"
                        Height: =36
                        LayoutMinHeight: =36
                        LayoutMinWidth: =0
                        Placeholder: ="Required"
                  - conTaRow1:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =UAB.White
                        FillPortions: =0
                        Height: =64
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - conTaStage:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =UAB.White
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - lblTaStageCap:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =UAB.Gray700
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =UABSize.Secondary
                                    Text: ="Stage"
                                    Wrap: =false
                              - cmbTaStage:
                                  Control: ModernCombobox
                                  Properties:
                                    AccessibleLabel: ="Stage"
                                    Height: =36
                                    ItemDisplayText: =ThisItem.Title
                                    Items: =SortByColumns(Filter(Stages, IsActive), "OrderIndex", SortOrder.Ascending)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    SelectMultiple: =false
                        - conTaRole:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =UAB.White
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - lblTaRoleCap:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =UAB.Gray700
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =UABSize.Secondary
                                    Text: ="Assigned to"
                                    Wrap: =false
                              - cmbTaRole:
                                  Control: ModernCombobox
                                  Properties:
                                    AccessibleLabel: ="Assigned to"
                                    Height: =36
                                    ItemDisplayText: =ThisItem.Value
                                    Items: =Choices(Tasks.AssigneeRole)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    SelectMultiple: =false
                  - conTaRow2:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =UAB.White
                        FillPortions: =0
                        Height: =64
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - conTaDue:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =UAB.White
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - lblTaDueCap:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =UAB.Gray700
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =UABSize.Secondary
                                    Text: ="Due date"
                                    Wrap: =false
                              - dpTaDue:
                                  Control: ModernDatePicker
                                  Properties:
                                    AccessibleLabel: ="Due date"
                                    Height: =36
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                        - conTaPrio:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =UAB.White
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - lblTaPrioCap:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =UAB.Gray700
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =UABSize.Secondary
                                    Text: ="Priority"
                                    Wrap: =false
                              - cmbTaPriority:
                                  Control: ModernCombobox
                                  Properties:
                                    AccessibleLabel: ="Priority"
                                    DefaultSelectedItems: =Filter(Choices(Tasks.Priority), Value = "Medium")
                                    Height: =36
                                    ItemDisplayText: =ThisItem.Value
                                    Items: =Choices(Tasks.Priority)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    SelectMultiple: =false
                  - tglTaRequired:
                      Control: ModernToggle
                      Properties:
                        BasePaletteColor: =UAB.Green
                        Default: =true
                        Height: =36
                        Label: ="Required to finish the stage"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                  - conTaActions:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =UAB.White
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - btnTaSave:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Add Task to the checklist"
                              Align: =Align.Center
                              BasePaletteColor: =UAB.Green
                              DisplayMode: |-
                                =If(!IsBlank(Trim(txtTaTitle.Text)),
                                    DisplayMode.Edit, DisplayMode.Disabled)
                              FontWeight: =""
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =IfError(
                                    Patch(Tasks, Defaults(Tasks),
                                        {Candidate: {Id: Coalesce(varSelCandId, 0),
                                                     Value: LookUp(Candidates, ID = Coalesce(varSelCandId, 0)).Title},
                                         CandName: LookUp(Candidates, ID = Coalesce(varSelCandId, 0)).Title,
                                         Title: Trim(txtTaTitle.Text),
                                         Stage: If(IsBlank(cmbTaStage.Selected), Blank(),
                                             {Id: cmbTaStage.Selected.ID,
                                              Value: cmbTaStage.Selected.Title}),
                                         StageName: Coalesce(cmbTaStage.Selected.Title, ""),
                                         StageOrder: Coalesce(cmbTaStage.Selected.OrderIndex, 0),
                                         TStatus: {Value: "To Do"},
                                         Priority: If(IsBlank(cmbTaPriority.Selected),
                                             {Value: "Medium"}, {Value: cmbTaPriority.Selected.Value}),
                                         AssigneeRole: If(IsBlank(cmbTaRole.Selected), Blank(),
                                             {Value: cmbTaRole.Selected.Value}),
                                         DueDate: dpTaDue.SelectedDate,
                                         PendingAnchor: false,
                                         IsRequired: tglTaRequired.Checked,
                                         IsPrereq: false,
                                         NeedsApproval: false,
                                         Anchor: {Value: "None"},
                                         UpdatedVia: "App"}),
                                    Notify("Couldn't add the task - " & FirstError.Message
                                        & " Nothing was created. Try again.", NotificationType.Error),
                                    Notify(Trim(txtTaTitle.Text) & " added.", NotificationType.Success));
                                Set(varTaShow, false)
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: ="Add Task"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =130
                        - btnTaCancel:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Cancel and close the new task form"
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Secondary
                              BasePaletteColor: =UAB.Green
                              FontWeight: =""
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(varTaShow, false)
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: ="Cancel"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =110
