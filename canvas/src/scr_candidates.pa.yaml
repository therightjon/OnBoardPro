Screens:
  scr_candidates:
    Properties:
      Fill: =UAB.OffWhite
    Children:
      - NavRail_Candidates:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =UAB.Green
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =4
            PaddingBottom: =32
            PaddingTop: =32
            Width: =If(scr_candidates.Size = ScreenSize.Small, UABLayout.NavRailWidthCollapsed, UABLayout.NavRailWidth)
          Children:
            - lblAppName_Candidates:
                Control: Label
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =UAB.White
                  Font: =Font.Arial
                  FontWeight: =FontWeight.Bold
                  Height: =56
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =20
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =20
                  Text: ="OnBoardPro"
                  Visible: =scr_candidates.Size <> ScreenSize.Small
                  Wrap: =false
            - lblAppSub_Candidates:
                Control: Label
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =UAB.Gold
                  Font: =Font.Arial
                  Height: =24
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =20
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =11
                  Text: ="OBGYN Onboarding"
                  Visible: =scr_candidates.Size <> ScreenSize.Small
                  Wrap: =false
            - conNavNewCand_Candidates:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.Green
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =IsHR
                Children:
                  - conNavBarNewCand_Candidates:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =If(App.ActiveScreen = scr_new_candidate, UAB.Gold, RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =4
                  - icoNavNewCand_Candidates:
                      Control: Classic/Icon
                      Properties:
                        AccessibleLabel: ="New Candidate"
                        AlignInContainer: =AlignInContainer.Center
                        Color: =If(App.ActiveScreen = scr_new_candidate, UAB.White, UAB.NavInactive)
                        FocusedBorderColor: =UAB.Gold
                        Height: =44
                        Icon: =Icon.Add
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_new_candidate)
                        PaddingLeft: =12
                        TabIndex: =0
                        Width: =44
                  - lblNavNewCand_Candidates:
                      Control: Label
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =If(App.ActiveScreen = scr_new_candidate, UAB.White, UAB.NavInactive)
                        FillPortions: =1
                        FocusedBorderColor: =UAB.Gold
                        FocusedBorderThickness: =2
                        Font: =Font.Arial
                        FontWeight: =If(App.ActiveScreen = scr_new_candidate, FontWeight.Semibold, FontWeight.Normal)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_new_candidate)
                        PaddingBottom: =0
                        PaddingLeft: =8
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =UABSize.Body
                        TabIndex: =0
                        Text: ="New Candidate"
                        Visible: =scr_candidates.Size <> ScreenSize.Small
                        Wrap: =false
            - conNavCandidates_Candidates:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.Green
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =IsManagerOrHR
                Children:
                  - conNavBarCandidates_Candidates:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =If(App.ActiveScreen = scr_candidates, UAB.Gold, RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =4
                  - icoNavCandidates_Candidates:
                      Control: Classic/Icon
                      Properties:
                        AccessibleLabel: ="Candidates"
                        AlignInContainer: =AlignInContainer.Center
                        Color: =If(App.ActiveScreen = scr_candidates, UAB.White, UAB.NavInactive)
                        FocusedBorderColor: =UAB.Gold
                        Height: =44
                        Icon: =Icon.People
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_candidates)
                        PaddingLeft: =12
                        TabIndex: =0
                        Width: =44
                  - lblNavCandidates_Candidates:
                      Control: Label
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =If(App.ActiveScreen = scr_candidates, UAB.White, UAB.NavInactive)
                        FillPortions: =1
                        FocusedBorderColor: =UAB.Gold
                        FocusedBorderThickness: =2
                        Font: =Font.Arial
                        FontWeight: =If(App.ActiveScreen = scr_candidates, FontWeight.Semibold, FontWeight.Normal)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_candidates)
                        PaddingBottom: =0
                        PaddingLeft: =8
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =UABSize.Body
                        TabIndex: =0
                        Text: ="Candidates"
                        Visible: =scr_candidates.Size <> ScreenSize.Small
                        Wrap: =false
            - conNavMyTasks_Candidates:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.Green
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - conNavBarMyTasks_Candidates:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =If(App.ActiveScreen = scr_mytasks, UAB.Gold, RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =4
                  - icoNavMyTasks_Candidates:
                      Control: Classic/Icon
                      Properties:
                        AccessibleLabel: ="My Tasks"
                        AlignInContainer: =AlignInContainer.Center
                        Color: =If(App.ActiveScreen = scr_mytasks, UAB.White, UAB.NavInactive)
                        FocusedBorderColor: =UAB.Gold
                        Height: =44
                        Icon: =Icon.Check
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_mytasks)
                        PaddingLeft: =12
                        TabIndex: =0
                        Width: =44
                  - lblNavMyTasks_Candidates:
                      Control: Label
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =If(App.ActiveScreen = scr_mytasks, UAB.White, UAB.NavInactive)
                        FillPortions: =1
                        FocusedBorderColor: =UAB.Gold
                        FocusedBorderThickness: =2
                        Font: =Font.Arial
                        FontWeight: =If(App.ActiveScreen = scr_mytasks, FontWeight.Semibold, FontWeight.Normal)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_mytasks)
                        PaddingBottom: =0
                        PaddingLeft: =8
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =UABSize.Body
                        TabIndex: =0
                        Text: ="My Tasks"
                        Visible: =scr_candidates.Size <> ScreenSize.Small
                        Wrap: =false
            - conNavTemplates_Candidates:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.Green
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =IsHR
                Children:
                  - conNavBarTemplates_Candidates:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =If(App.ActiveScreen = scr_templates, UAB.Gold, RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =4
                  - icoNavTemplates_Candidates:
                      Control: Classic/Icon
                      Properties:
                        AccessibleLabel: ="Templates"
                        AlignInContainer: =AlignInContainer.Center
                        Color: =If(App.ActiveScreen = scr_templates, UAB.White, UAB.NavInactive)
                        FocusedBorderColor: =UAB.Gold
                        Height: =44
                        Icon: =Icon.DocumentWithContent
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_templates)
                        PaddingLeft: =12
                        TabIndex: =0
                        Width: =44
                  - lblNavTemplates_Candidates:
                      Control: Label
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =If(App.ActiveScreen = scr_templates, UAB.White, UAB.NavInactive)
                        FillPortions: =1
                        FocusedBorderColor: =UAB.Gold
                        FocusedBorderThickness: =2
                        Font: =Font.Arial
                        FontWeight: =If(App.ActiveScreen = scr_templates, FontWeight.Semibold, FontWeight.Normal)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_templates)
                        PaddingBottom: =0
                        PaddingLeft: =8
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =UABSize.Body
                        TabIndex: =0
                        Text: ="Templates"
                        Visible: =scr_candidates.Size <> ScreenSize.Small
                        Wrap: =false
            - conNavTaskLib_Candidates:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.Green
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =IsHR
                Children:
                  - conNavBarTaskLib_Candidates:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =If(App.ActiveScreen = scr_tasklibrary, UAB.Gold, RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =4
                  - icoNavTaskLib_Candidates:
                      Control: Classic/Icon
                      Properties:
                        AccessibleLabel: ="Task Library"
                        AlignInContainer: =AlignInContainer.Center
                        Color: =If(App.ActiveScreen = scr_tasklibrary, UAB.White, UAB.NavInactive)
                        FocusedBorderColor: =UAB.Gold
                        Height: =44
                        Icon: =Icon.Notebook
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_tasklibrary)
                        PaddingLeft: =12
                        TabIndex: =0
                        Width: =44
                  - lblNavTaskLib_Candidates:
                      Control: Label
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =If(App.ActiveScreen = scr_tasklibrary, UAB.White, UAB.NavInactive)
                        FillPortions: =1
                        FocusedBorderColor: =UAB.Gold
                        FocusedBorderThickness: =2
                        Font: =Font.Arial
                        FontWeight: =If(App.ActiveScreen = scr_tasklibrary, FontWeight.Semibold, FontWeight.Normal)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scr_tasklibrary)
                        PaddingBottom: =0
                        PaddingLeft: =8
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =UABSize.Body
                        TabIndex: =0
                        Text: ="Task Library"
                        Visible: =scr_candidates.Size <> ScreenSize.Small
                        Wrap: =false
      - cntCandidatesRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =UAB.OffWhite
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =24
            PaddingLeft: =If(scr_candidates.Size = ScreenSize.Small, 12, 24)
            PaddingRight: =If(scr_candidates.Size = ScreenSize.Small, 12, 24)
            PaddingTop: =24
            Width: =Parent.Width - If(scr_candidates.Size = ScreenSize.Small, UABLayout.NavRailWidthCollapsed, UABLayout.NavRailWidth)
            X: =If(scr_candidates.Size = ScreenSize.Small, UABLayout.NavRailWidthCollapsed, UABLayout.NavRailWidth)
          Children:
            - cntCKHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.OffWhite
                  FillPortions: =0
                  Height: =60
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - lblCKTitle:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =UAB.TextPrimary
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =UABSize.ScreenTitle
                        Text: ="Candidates"
            - conCKSplit:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =UAB.OffWhite
                  FillPortions: =0
                  Height: =If(scr_candidates.Size = ScreenSize.Small, 1088, Max(560, scr_candidates.Height - 132))
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(scr_candidates.Size = ScreenSize.Small, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =16
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - conCKPicker:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =UAB.Line
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =UAB.White
                        FillPortions: =0
                        Height: =If(scr_candidates.Size = ScreenSize.Small, 432, Parent.Height)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =If(scr_candidates.Size = ScreenSize.Small, Parent.Width, 320)
                      Children:
                        - conCKFilters:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =UAB.White
                              FillPortions: =0
                              Height: =208
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =12
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =12
                            Children:
                              - txtCKSearch:
                                  Control: ModernTextInput
                                  Properties:
                                    AccessibleLabel: ="Search candidates by name or email"
                                    Height: =36
                                    LayoutMinHeight: =36
                                    LayoutMinWidth: =0
                                    Placeholder: ="Search by name or email"
                              - lblCKStatusCap:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =UAB.Gray700
                                    FontWeight: =FontWeight.Semibold
                                    Height: =16
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =UABSize.Secondary
                                    Text: ="Status"
                              - cmbCKStatus:
                                  Control: ModernCombobox
                                  Properties:
                                    AccessibleLabel: ="Status filter"
                                    DefaultSelectedItems: |-
                                      =Table({Value: "Active"})
                                    Height: =36
                                    ItemDisplayText: =ThisItem.Value
                                    Items: =Choices(Candidates.CStatus)
                                    LayoutMinHeight: =36
                                    LayoutMinWidth: =0
                              - lblCKDivisionCap:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =UAB.Gray700
                                    FontWeight: =FontWeight.Semibold
                                    Height: =16
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =UABSize.Secondary
                                    Text: ="Division"
                              - cmbCKDivision:
                                  Control: ModernCombobox
                                  Properties:
                                    AccessibleLabel: ="Division filter"
                                    DefaultSelectedItems: =Filter(Divisions, ID = MyDivisionId)
                                    Height: =36
                                    ItemDisplayText: =ThisItem.Title
                                    Items: =SortByColumns(Divisions, "Title", SortOrder.Ascending)
                                    LayoutMinHeight: =36
                                    LayoutMinWidth: =0
                        - lblMTBottomSpacer_1:
                            Control: ModernText
                            Properties:
                              Align: =Align.Center
                              Color: =UAB.OffWhite
                              Height: =10
                              Size: =2
                              Text: =""
                              Wrap: =false
                              X: =40
                              Y: =40
                        - galCKCands:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              AccessibleLabel: ="Candidate list"
                              Fill: =UAB.White
                              Items: |-
                                =SortByColumns(
                                    Filter(FirstN(Candidates, 500),
                                        (IsBlank(txtCKSearch.Text) || txtCKSearch.Text in Title
                                            || txtCKSearch.Text in Coalesce(Email, "")),
                                        (Coalesce(CountRows(cmbCKStatus.SelectedItems), 0) = 0
                                            || CStatus.Value in ShowColumns(cmbCKStatus.SelectedItems, Value)),
                                        (Coalesce(CountRows(cmbCKDivision.SelectedItems), 0) = 0
                                            || Division.Id in ShowColumns(cmbCKDivision.SelectedItems, ID))),
                                    "Title", SortOrder.Ascending)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varSelCandId, ThisItem.ID);
                                Set(varDtClearLOI, false);
                                Set(varDtClearLOOIss, false);
                                Set(varDtClearLOOAcc, false);
                                Set(varDtClearStart, false)
                              TabIndex: =0
                              TemplatePadding: =0
                              TemplateSize: =56
                            Children:
                              - conCKPickRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =If(ThisItem.ID = Coalesce(varSelCandId, 0), UAB.GoldTint, UAB.White)
                                    Height: =Parent.TemplateHeight
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    Width: =Parent.TemplateWidth
                                  Children:
                                    - conCKPickRowContent:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =If(ThisItem.ID = Coalesce(varSelCandId, 0), UAB.GoldTint, UAB.White)
                                          FillPortions: =0
                                          Height: =55
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingLeft: =12
                                          PaddingRight: =12
                                        Children:
                                          - conCKPickRowMain:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =If(ThisItem.ID = Coalesce(varSelCandId, 0), UAB.GoldTint, UAB.White)
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =2
                                                LayoutJustifyContent: =LayoutJustifyContent.Center
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                              Children:
                                                - lblCKPickName:
                                                    Control: Label
                                                    Properties:
                                                      Color: =UAB.TextPrimary
                                                      FocusedBorderColor: =UAB.Gold
                                                      FocusedBorderThickness: =2
                                                      Font: =Font.Arial
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =25
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      OnSelect: |-
                                                        =Set(varSelCandId, ThisItem.ID);
                                                        Set(varDtClearLOI, false);
                                                        Set(varDtClearLOOIss, false);
                                                        Set(varDtClearLOOAcc, false);
                                                        Set(varDtClearStart, false)
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =UABSize.Body
                                                      TabIndex: =0
                                                      Text: =Coalesce(ThisItem.Title, "(unnamed)")
                                                      Wrap: =false
                                                - lblCKPickSub:
                                                    Control: Label
                                                    Properties:
                                                      Color: =UAB.Gray500
                                                      FocusedBorderColor: =UAB.Gold
                                                      FocusedBorderThickness: =2
                                                      Font: =Font.Arial
                                                      Height: =22
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      OnSelect: |-
                                                        =Set(varSelCandId, ThisItem.ID);
                                                        Set(varDtClearLOI, false);
                                                        Set(varDtClearLOOIss, false);
                                                        Set(varDtClearLOOAcc, false);
                                                        Set(varDtClearStart, false)
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =UABSize.Secondary
                                                      TabIndex: =0
                                                      Text: =Coalesce(ThisItem.CurrentStage.Value, "No stage") & "  ·  " & Coalesce(ThisItem.CStatus.Value, "")
                                                      Wrap: =false
                                          - icoCKPickGo:
                                              Control: Classic/Icon
                                              Properties:
                                                AccessibleLabel: ="Open this candidate"
                                                Color: =UAB.Gray300
                                                FocusedBorderColor: =UAB.Gold
                                                Height: =20
                                                Icon: =Icon.ChevronRight
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnSelect: |-
                                                  =Set(varSelCandId, ThisItem.ID);
                                                  Set(varDtClearLOI, false);
                                                  Set(varDtClearLOOIss, false);
                                                  Set(varDtClearLOOAcc, false);
                                                  Set(varDtClearStart, false)
                                                TabIndex: =0
                                                Width: =20
                                    - conCKPickRowDivider:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =UAB.Line
                                          FillPortions: =0
                                          Height: =1
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                        - conCKPickEmpty:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =UAB.White
                              FillPortions: =0
                              Height: =56
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Visible: =galCKCands.AllItemsCount = 0
                            Children:
                              - lblCKPickEmpty:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    Color: =UAB.Gray500
                                    Height: =20
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =UABSize.Secondary
                                    Text: ="No candidates match the current filters."
                  - conCKDetail:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =UAB.OffWhite
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingLeft: =2
                        PaddingRight: =2
                      Children:
                        - conCKNoSelection:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =UAB.Line
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =UAB.White
                              FillPortions: =0
                              Height: =If(Coalesce(varSelCandId, 0) = 0, 120, 0)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Visible: =Coalesce(varSelCandId, 0) = 0
                            Children:
                              - lblCKNoSelection:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    Color: =UAB.Gray500
                                    Height: =20
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =UABSize.Body
                                    Text: ="Select a candidate to see their pipeline."
                        - conCKHead:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =UAB.Line
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =UAB.White
                              FillPortions: =0
                              Height: =If(scr_candidates.Size = ScreenSize.Small, 446, 310)
                              LayoutAlignItems: =LayoutAlignItems.Stretch
