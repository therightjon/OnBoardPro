name: "OnBoardPro CodeQL Configuration"

# Focus scanning on runtime application code and exclude test-only fixtures/helpers.
paths-ignore:
  - "server/tests/**"
  - "client/tests/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"

# This codebase uses custom DB-backed middleware in server/middleware/rate-limiter.ts.
# CodeQL's js/missing-rate-limiting query targets common library patterns and
# produces false positives against this implementation.
query-filters:
  - exclude:
      id: js/missing-rate-limiting
